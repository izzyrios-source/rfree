<!DOCTYPE html>
<html lang="en">
<head>

<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:monospace}
  #help{position:fixed;left:10px;top:10px;color:#fff;background:rgba(0,0,0,.5);padding:8px 12px;border-radius:6px;font-size:13px;line-height:1.5;pointer-events:none}

<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js",

<body>
<div id="help">
<b>CHRONO ACE VR</b><br>
VR: left stick = steer (push forward to dive) &middot; either trigger = fire where that hand points<br>
Desktop: click to capture mouse &middot; mouse / WASD / arrows = steer &middot; click or Space = fire
</div>
<script type="module">

import * as THREE from 'three';
import { VRButton } from 'three/addons/webxr/VRButton.js';

// ---------- Setup ----------
const scene = new THREE.Scene();
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.xr.enabled = true;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.xr.setReferenceSpaceType('local');
document.body.appendChild(renderer.domElement);
document.body.appendChild(VRButton.createButton(renderer));

const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.05, 2000);
const player = new THREE.Group();
player.rotation.order = 'YXZ';
scene.add(player);
player.add(camera);

const hemi = new THREE.HemisphereLight(0xffffff, 0x446688, 1.1);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 2.2);
// A low fill light from the opposite side. This is the cheap trick that makes
// terrain relief visible: one light alone flattens anything facing it.
const fill = new THREE.DirectionalLight(0xbcd4ff, 0.55);
fill.position.set(-0.6, 0.25, 0.75);
scene.add(fill);
sun.position.set(50, 100, 30);
scene.add(sun);
scene.fog = new THREE.FogExp2(0xbfe3ff, 0.0011);   // exponential haze reads as real distance

// Gradient sky dome with sun disc and glow
const skyU = {
  top: { value: new THREE.Color(0x2a6fd6) }, horizon: { value: new THREE.Color(0xbfe3ff) },
  bottom: { value: new THREE.Color(0x2b5a7a) }, sunColor: { value: new THREE.Color(0xfff2cc) },
  sunDir: { value: new THREE.Vector3(0.4, 0.35, -0.85).normalize() },
};
const sky = new THREE.Mesh(new THREE.SphereGeometry(1500, 48, 24), new THREE.ShaderMaterial({
  uniforms: skyU, side: THREE.BackSide, depthWrite: false,
  vertexShader: `varying vec3 vDir;
void main(){ vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `uniform vec3 top; uniform vec3 horizon; uniform vec3 bottom; uniform vec3 sunColor; uniform vec3 sunDir;
varying vec3 vDir;
void main(){
  vec3 d = normalize(vDir); float h = d.y;
  // Sharper falloff: the sky darkens quickly away from the horizon and the ground
  // drops to its own colour fast, so the boundary reads as a line rather than a blur.
  vec3 c = h > 0.0 ? mix(horizon, top, pow(h, 0.32)) : mix(horizon, bottom, pow(-h, 0.16));
  // A bright haze band hugging the horizon, fading out within a couple of degrees.
  float band = exp(-abs(h) * 220.0);
  // A hard dark edge just under the horizon: this is what makes it read as a horizon.
  float edge = smoothstep(0.004, -0.012, h) * 0.55;
  c = mix(c, c * 0.62, edge);
  c += horizon * band * 0.9;
  float s = max(dot(d, normalize(sunDir)), 0.0);
  c += sunColor * (pow(s, 900.0) * 6.0 + pow(s, 40.0) * 0.5 + pow(s, 6.0) * 0.18);
  gl_FragColor = vec4(c, 1.0);
  #include <tonemapping_fragment>
  #include <colorspace_fragment>
}`,
}));
sky.frustumCulled = false; sky.renderOrder = -1;
scene.add(sky);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ---------- Eras ----------
const ERAS = [
  { year: 1914, top: 0x3d7fd1, horizon: 0xdcefff, bottom: 0x3c5a34, sun: 0xfff3d6, sunDir: [0.4, 0.5, -0.8], cloud: 0xffffff, shade: 0xc9d3de, color: 0x9b7a48, speed: 20, shape: 'biplane' },
  { year: 1944, top: 0x2f63b0, horizon: 0xbcd8f0, bottom: 0x16384d, sun: 0xfff0d0, sunDir: [-0.5, 0.4, -0.75], cloud: 0xffffff, shade: 0xb8c4d2, color: 0x56703f, speed: 26, shape: 'prop' },
  { year: 1968, top: 0x1d4f9a, horizon: 0xaecbe8, bottom: 0x2a4630, sun: 0xffffff, sunDir: [0.2, 0.7, -0.6], cloud: 0xf4f8ff, shade: 0xaab6c4, color: 0xa8acb0, speed: 34, shape: 'jet' },
  { year: 1991, top: 0x34296a, horizon: 0xff9c5c, bottom: 0x2a1d30, sun: 0xffb070, sunDir: [0.0, 0.08, -1.0], cloud: 0xffd2b0, shade: 0x8a6a80, color: 0x4a4a58, speed: 40, shape: 'jet' },
  { year: 2077, top: 0x07021a, horizon: 0x7a2496, bottom: 0x06021a, sun: 0xff55cc, sunDir: [0.3, 0.15, -0.9], cloud: 0x9a7cff, shade: 0x3a2a70, color: 0x55ffcc, speed: 48, shape: 'saucer' },
];
let eraIndex = 0, loopCount = 0;
const era = () => ERAS[eraIndex];
const KILLS_FOR_BOSS = 20;

// ---------- Audio engine ----------
let actx = null, masterGain = null, comp = null, engine = null, noiseBuf = null, panNode = null, hum = { osc1: null, osc2: null, sub: null };
function initAudio() {
  if (!actx) {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    comp = actx.createDynamicsCompressor();
    comp.threshold.value = -18; comp.knee.value = 12; comp.ratio.value = 5;
    masterGain = actx.createGain(); masterGain.gain.value = 0.85;
    comp.connect(masterGain).connect(actx.destination);
    const len = actx.sampleRate * 2;
    noiseBuf = actx.createBuffer(1, len, actx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    startEngine();
  }
  if (actx.state === 'suspended') actx.resume();
  realMusicBus();
}
renderer.xr.addEventListener('sessionstart', initAudio);

// Listener follows the head, so sound comes from the right direction
function updateListener() {
  if (!actx) return;
  const p = new THREE.Vector3(), q = new THREE.Quaternion(), up = new THREE.Vector3(0, 1, 0);
  camera.getWorldPosition(p); camera.getWorldQuaternion(q);
  const f = new THREE.Vector3(0, 0, -1).applyQuaternion(q);
  const l = actx.listener;
  if (l.positionX) {
    const t = actx.currentTime;
    l.positionX.setTargetAtTime(p.x, t, 0.02); l.positionY.setTargetAtTime(p.y, t, 0.02); l.positionZ.setTargetAtTime(p.z, t, 0.02);
    l.forwardX.setTargetAtTime(f.x, t, 0.02); l.forwardY.setTargetAtTime(f.y, t, 0.02); l.forwardZ.setTargetAtTime(f.z, t, 0.02);
    l.upX.setTargetAtTime(up.x, t, 0.02); l.upY.setTargetAtTime(up.y, t, 0.02); l.upZ.setTargetAtTime(up.z, t, 0.02);
  } else { l.setPosition(p.x, p.y, p.z); l.setOrientation(f.x, f.y, f.z, up.x, up.y, up.z); }
}
function audioNow() { return actx ? actx.currentTime : 0; }

function noiseSrc() {
  const s = actx.createBufferSource();
  s.buffer = noiseBuf; s.loop = true; return s;
}
function envGain(t, attack, hold, peak) {
  const g = actx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(peak, t + attack);
  g.gain.exponentialRampToValueAtTime(0.0001, t + attack + hold);
  return g;
}
function panner(pos) {
  const p = actx.createPanner();
  p.panningModel = 'HRTF'; p.distanceModel = 'inverse';
  p.refDistance = 12; p.maxDistance = 600; p.rolloffFactor = 1.4;
  const v = pos || new THREE.Vector3();
  if (p.positionX) { p.positionX.value = v.x; p.positionY.value = v.y; p.positionZ.value = v.z; }
  else p.setPosition(v.x, v.y, v.z);
  return p;
}

// Waveform snapshots, built once and reused for every shot or explosion
let waveCache = null;
function cachedWave(pts) {
  if (waveCache === null) waveCache = new Map();
  const key = pts.join(',');
  if (!waveCache.has(key)) {
    const w = actx.createWaveShaper();
    const n = 64, curve = new Float32Array(n);
    for (let i = 0; i < n; i++) curve[i] = pts[i % pts.length];
    w.curve = curve; w.oversample = '4x';
    waveCache.set(key, w);
  }
  return waveCache.get(key);
}

// Twin cannons: a hard body thump plus a bright snapping crack, distance-mapped
const SHOOT_WAVE = [0, 0.7, 1, 0.55, -0.4, -0.85, -0.25, 0.5, 0.2, -0.15];
function sfxShoot(pos) {
  if (!actx) return;
  const t = actx.currentTime;
  const p = panner(pos);
  const o = actx.createOscillator(), g = envGain(t, 0.001, 0.09, 0.32);
  o.frequency.setValueAtTime(340, t); o.frequency.exponentialRampToValueAtTime(70, t + 0.1);
  if (o.setPeriodicWave) { try { o.setPeriodicWave(cachedWave(SHOOT_WAVE)); } catch (err) { o.type = 'triangle'; } }
  else o.type = 'triangle';
  o.connect(g).connect(p).connect(comp); o.start(t); o.stop(t + 0.12);
  const n = noiseSrc(), bp = actx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 2400; bp.Q.value = 1.4;
  const ng = envGain(t, 0.001, 0.07, 0.26);
  n.connect(bp).connect(ng).connect(p).connect(comp); n.start(t); n.stop(t + 0.09);
  // cockpit rattle and a short slap of reverb-ish tail
  const r = actx.createOscillator(), rg = envGain(t, 0.002, 0.16, 0.07);
  r.type = 'square'; r.frequency.setValueAtTime(96, t); r.frequency.linearRampToValueAtTime(58, t + 0.15);
  r.connect(rg).connect(comp); r.start(t); r.stop(t + 0.18);
  const tail = noiseSrc(), tf = actx.createBiquadFilter(); tf.type = 'bandpass'; tf.frequency.value = 1100; tf.Q.value = 0.7;
  const tg = envGain(t + 0.03, 0.02, 0.3, 0.09);
  tail.connect(tf).connect(tg).connect(p).connect(comp); tail.start(t + 0.03); tail.stop(t + 0.4);
}

// Explosion: body of filtered noise, a sub-bass punch, and debris tail
function sfxBoom(pos, size) {
  if (!actx) return;
  const t = actx.currentTime, big = size > 2;  const p = panner(pos);
  const n = noiseSrc(), lp = actx.createBiquadFilter(); lp.type = 'lowpass';
  lp.frequency.setValueAtTime(3800, t); lp.frequency.exponentialRampToValueAtTime(big ? 120 : 320, t + (big ? 1.3 : 0.45));
  const ng = envGain(t, 0.004, big ? 1.3 : 0.42, big ? 1.0 : 0.55);
  n.connect(lp).connect(ng).connect(p).connect(comp); n.start(t); n.stop(t + (big ? 1.5 : 0.55));
  const o = actx.createOscillator(), og = envGain(t, 0.003, big ? 0.7 : 0.28, big ? 0.9 : 0.6);
  o.type = 'sine'; o.frequency.setValueAtTime(big ? 90 : 130, t);
  o.frequency.exponentialRampToValueAtTime(big ? 26 : 55, t + (big ? 0.75 : 0.3));
  o.connect(og).connect(p).connect(comp); o.start(t); o.stop(t + (big ? 0.85 : 0.35));
  // debris crackle
  const c = noiseSrc(), hp = actx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 1800;
  const cg = envGain(t + 0.03, 0.02, big ? 1.1 : 0.35, big ? 0.22 : 0.16);
  c.connect(hp).connect(cg).connect(p).connect(comp); c.start(t + 0.03); c.stop(t + (big ? 1.3 : 0.45));
  if (big) { const tail = noiseSrc(), tg = envGain(t + 0.35, 0.4, 2.2, 0.3);
    const tf = actx.createBiquadFilter(); tf.type = 'lowpass'; tf.frequency.value = 500;
    tail.connect(tf).connect(tg).connect(p).connect(comp); tail.start(t + 0.35); tail.stop(t + 2.9); }
}

// Radar ping: a short bright blip with a gentle tail
function sfxBeep(freq, dur, vol, type) {
  if (!actx) return;
  const t = actx.currentTime, o = actx.createOscillator(), g = envGain(t, 0.004, dur, vol);
  o.type = type || 'square'; o.frequency.setValueAtTime(freq, t);
  o.frequency.exponentialRampToValueAtTime(freq * 0.75, t + dur);
  const sh = actx.createWaveShaper(), curve = new Float32Array(64);
  for (let i = 0; i < 64; i++) curve[i] = Math.tanh((i / 32 - 1) * 2);
  sh.curve = curve;
  o.connect(sh).connect(g).connect(comp); o.start(t); o.stop(t + dur + 0.12);
}

// Taking a hit: metal clang over a low thud, plus a brief ringing shell
function sfxDamage() {
  if (!actx) return;
  const t = actx.currentTime;
  const o = actx.createOscillator(), g = envGain(t, 0.002, 0.28, 0.45);
  o.type = 'sine'; o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(48, t + 0.3);
  o.connect(g).connect(comp); o.start(t); o.stop(t + 0.35);
  const n = noiseSrc(), bp = actx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1800; bp.Q.value = 0.6;
  const ng = envGain(t, 0.001, 0.2, 0.5);
  n.connect(bp).connect(ng).connect(comp); n.start(t); n.stop(t + 0.25);
  [820, 1240, 1880].forEach((f, i) => {
    const r = actx.createOscillator(), rg = envGain(t + 0.01, 0.01, 1.1 - i * 0.25, 0.12 / (i + 1));
    r.type = 'triangle'; r.frequency.setValueAtTime(f, t + 0.01);
    r.connect(rg).connect(comp); r.start(t + 0.01); r.stop(t + 1.2);
  });
}
// Warning buzzer
function sfxAlarm(times, from, to) {
  if (!actx) return;
  const t0 = actx.currentTime;
  for (let i = 0; i < (times || 3); i++) {
    const t = t0 + i * 0.24, o = actx.createOscillator(), g = envGain(t, 0.01, 0.2, 0.22);
    o.type = 'sawtooth'; o.frequency.setValueAtTime(from, t); o.frequency.linearRampToValueAtTime(to, t + 0.2);
    o.connect(g).connect(comp); o.start(t); o.stop(t + 0.25);
  }
}
// Chord sweep for a time warp
function sfxWarp() {
  if (!actx) return;
  const t = actx.currentTime, freqs = [220, 277.2, 329.6, 440, 554.4];
  freqs.forEach((f, i) => {
    const o = actx.createOscillator(), g = envGain(t + i * 0.05, 0.15, 1.4, 0.13);
    o.type = i % 2 ? 'triangle' : 'sine';
    o.frequency.setValueAtTime(f, t + i * 0.05);
    o.frequency.exponentialRampToValueAtTime(f * 4, t + i * 0.05 + 1.2);
    o.connect(g).connect(comp); o.start(t + i * 0.05); o.stop(t + i * 0.05 + 1.8);
  });
  const n = noiseSrc(), bp = actx.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 3;
  bp.frequency.setValueAtTime(200, t); bp.frequency.exponentialRampToValueAtTime(6000, t + 1.5);
  const ng = envGain(t, 0.4, 1.4, 0.35);
  n.connect(bp).connect(ng).connect(comp); n.start(t); n.stop(t + 2.0);
}

// Continuous engine: filtered noise, two blade-tone oscillators and a sub rumble
function startEngine() {
  engine = actx.createGain(); engine.gain.value = 0.0001;
  const lp = actx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 380; lp.Q.value = 0.9;
  const rumble = actx.createBiquadFilter(); rumble.type = 'lowpass'; rumble.frequency.value = 130;
  const n1 = noiseSrc(), n2 = noiseSrc();
  const g1 = actx.createGain(); g1.gain.value = 0.5;
  const g2 = actx.createGain(); g2.gain.value = 0.6;
  n1.connect(lp).connect(g1).connect(engine);
  n2.connect(rumble).connect(g2).connect(engine);
  const blade = actx.createBiquadFilter(); blade.type = 'bandpass'; blade.frequency.value = 170; blade.Q.value = 6;
  const bg = actx.createGain(); bg.gain.value = 0.35;
  blade.connect(bg).connect(engine);
  panNode = actx.createStereoPanner ? actx.createStereoPanner() : actx.createGain();
  engine.connect(panNode).connect(comp);
  [n1, n2].forEach(n => n.start());
  const o1 = actx.createOscillator(), o2 = actx.createOscillator(), sub = actx.createOscillator();
  o1.type = 'sawtooth'; o2.type = 'sawtooth'; sub.type = 'sine';
  o1.frequency.value = 88; o2.frequency.value = 92; sub.frequency.value = 44;
  const og = actx.createGain(); og.gain.value = 0.16;
  o1.connect(blade); o2.connect(blade); sub.connect(og).connect(engine);
  o1.start(); o2.start(); sub.start();
  hum = { osc1: o1, osc2: o2, sub };
}
// Engine note follows speed and turning; Y coordinates map to left/right in Web Audio
function setEngine(level, speed, turn) {
  if (!actx || !engine) return;
  const t = actx.currentTime;
  engine.gain.setTargetAtTime(level, t, 0.15);
  hum.osc1.frequency.setTargetAtTime(72 + speed * 0.7, t, 0.2);
  hum.osc2.frequency.setTargetAtTime(78 + speed * 0.8, t, 0.2);
  hum.sub.frequency.setTargetAtTime(36 + speed * 0.3, t, 0.3);
  if (panNode && panNode.pan) panNode.pan.setTargetAtTime(Math.max(-1, Math.min(1, -turn * 0.7)), t, 0.2);
}

// ---------- Action music: a driving loop that changes with each era ----------
// State first, then the functions that read it, so nothing is touched before it exists.
// Rock riffs: each era gets its own root and a pentatonic minor shape for the lead
// ---------- One song per era ----------
// Each era gets its own riff pattern, tempo, key, chord progression, drum feel and
// lead motif, so the five sections sound like five different tracks.
const SONGS = [
  { // 1914 - a military march: triads, dotted rhythm, no lead, bugle-like fanfare
    name: 'SOPWITH MARCH', bpm: 118, root: 55,
    style: 'march',
    scale: [0, 2, 4, 7, 9],
    chords: [[0, 4, 7], [0, 4, 7], [5, 9, 12], [7, 11, 14]],   // full triads
    // one step per eighth note: which chord voices to strike (0 = none)
    hits: [1, 0, 1, 1, 0, 1, 1, 0],
    kick: [0, 4, 8, 12], snareOn: [], hatOn: 'march',
    leadOn: 999,                       // this one has no lead line at all
    fanfareOn: 48,                     // instead a simple bugle call in the last bar
    bend: 0, swing: 0, mute: 0.3,
  },
  { // 1944 - swing: walking bass, brushes, wide chords, sax-like lead
    name: 'BIG BAND BOOGIE', bpm: 160, root: 62,
    style: 'swing',
    scale: [0, 2, 4, 5, 7, 9, 11],
    chords: [[0, 4, 7, 11], [2, 5, 9, 12], [5, 9, 12, 16], [7, 11, 14, 17]],
    hits: [1, 0, 0, 1, 1, 0, 1, 0],
    kick: [0, 8], snareOn: [4, 12], hatOn: 'brush',
    leadOn: 16, leadType: 'sax', bend: 4, swing: 0.38, mute: 0.18,
    walking: true,                     // bass walks instead of chugging
  },
  { // 1968 - heavy blues rock: power chords, hard backbeat, wah lead
    name: 'IRON SKY', bpm: 140, root: 58,
    style: 'blues',
    scale: [0, 3, 5, 6, 7, 10],
    chords: [[0, 7], [3, 10], [5, 12], [7, 14]],
    hits: [1, 0, 1, 0, 1, 1, 0, 1],
    kick: [0, 3, 8, 11], snareOn: [4, 12], hatOn: 'eighths',
    leadOn: 32, leadType: 'wah', bend: 6, swing: 0, mute: 0.5,
  },
  { // 1991 - grunge: dropped tuning feel, lurching stops, feedback scree
    name: 'CHROME TEETH', bpm: 126, root: 53,
    style: 'grunge',
    scale: [0, 1, 5, 7, 8, 10],
    chords: [[0, 7], [-2, 5], [3, 10], [1, 8]],
    hits: [1, 1, 0, 0, 1, 0, 1, 1],
    kick: [0, 6, 10, 14], snareOn: [4, 12], hatOn: 'none',
    leadOn: 999, screechOn: 30,        // shrieking feedback instead of a melody
    bend: 9, swing: 0, mute: 0.8, halfTime: true,
  },
  { // 2077 - thrash: blast beat, tremolo picking, screaming lead
    name: 'NEON OVERDRIVE', bpm: 184, root: 49,
    style: 'thrash',
    scale: [0, 3, 5, 6, 7, 10],
    chords: [[0, 7], [0, 3], [0, 7], [0, 5]],
    hits: [1, 1, 1, 1, 1, 1, 1, 1],
    kick: [0, 2, 4, 6, 8, 10, 12, 14], snareOn: [4, 12], hatOn: 'crash',
    leadOn: 16, leadType: 'shred', bend: 12, swing: 0, mute: 0.9,
    tremolo: true,
  },
];
const song = () => SONGS[eraIndex % SONGS.length] || SONGS[0];
const music = { on: false, bus: null, filter: null, nextTime: 0, step: 0 };
let musicMuted = false;   // player-facing toggle, survives pause and death
let musicReady = false;

// Build the graph once, guarded: if anything is missing we simply stay silent.
function musicArm() {
  if (musicReady) return true;
  if (!actx || !comp || !actx.createGain) return false;
  try {
    music.bus = actx.createGain();
    music.bus.gain.value = 0.0001;
    music.filter = actx.createBiquadFilter();
    music.filter.type = 'lowpass';
    music.filter.frequency.value = 2600;
    music.filter.Q.value = 0.6;
    music.bus.connect(music.filter);
    music.filter.connect(comp);
    musicReady = true;
  } catch (err) {
    musicReady = false;
  }
  return musicReady;
}

function musicStart() {
  if (musicMuted) { music.on = false; return; }
  if (!musicArm()) return;
  if (music.on) return;
  music.on = true;
  music.step = 0;
  music.nextTime = actx.currentTime + 0.2;
  try { music.bus.gain.setTargetAtTime(0.5, actx.currentTime, 0.6); } catch (err) { music.on = false; }
}

function musicStop() {
  if (!music.on || !musicReady) { music.on = false; return; }
  music.on = false;
  try { music.bus.gain.setTargetAtTime(0.0001, actx.currentTime, 0.4); } catch (err) {}
}

// A power-chord guitar voice: two detuned saws through a soft-clip, with a bright

  if (!Number.isFinite(at) || !Number.isFinite(dur) || dur <= 0) return;
  if (!Number.isFinite(gain) || gain <= 0) return;

  if (!dest) return;

  const spread = [1.0, 1.0035, 0.9968];
  const body = actx.createGain();
  body.gain.setValueAtTime(0.0001, at);
  body.gain.linearRampToValueAtTime(gain, at + 0.005);
  body.gain.linearRampToValueAtTime(gain * 0.72, at + 0.06);
  body.gain.linearRampToValueAtTime(gain * 0.38, at + Math.max(0.12, dur * 0.6));
  body.gain.exponentialRampToValueAtTime(0.0001, at + dur);

function drum(at, kind, gain) {

function musicPump(now) {
  if (!music.on || !musicReady) return;
  const sg = song();
  const spb = 60 / sg.bpm;
  if (!Number.isFinite(spb) || spb <= 0) return;
  if (!Number.isFinite(music.nextTime)) { music.nextTime = actx.currentTime + 0.2; return; }
  if (!Number.isFinite(music.step)) music.step = 0;
  const root = sg.root * 2;
  const sc = sg.scale || [0];
  const chords = sg.chords || [[0, 7]];
  const hits = sg.hits || [1, 0, 1, 0, 1, 0, 1, 0];
  const swing = Number.isFinite(sg.swing) ? sg.swing : 0;
  const mute = Number.isFinite(sg.mute) ? sg.mute : 0.4;
  let guard = 0;
  while (music.nextTime < actx.currentTime + 0.25 && guard++ < 24) {
    const t = music.nextTime;
    const step = Math.floor(music.step) % 64;
    const inBar = step % 16;
    const bar = Math.floor(step / 16);
    const eighth = Math.floor(inBar / 2);
    const semis = n => Math.pow(2, n / 12);
    const degree = k => {
      const idx = Math.floor(Math.abs(k)) % sc.length;
      const v = sc[idx];
      return Number.isFinite(v) ? v : 0;
    };
    const chord = chords[bar % chords.length] || [0];
    const voices = chord.filter(v => Number.isFinite(v));

    // ---- drums in this song's own feel ----
    if (sg.kick.indexOf(inBar) !== -1) drum(t, 'kick', inBar % 4 === 0 ? 0.62 : 0.44);
    if (sg.snareOn.indexOf(inBar) !== -1) drum(t, 'snare', 0.44);
    if (sg.hatOn === 'brush') { if (inBar % 4 === 1) drum(t, 'hat', 0.035); }
    else if (sg.hatOn === 'march') { if (inBar % 4 === 0) drum(t, 'snare', 0.18); }
    else if (sg.hatOn === 'crash') { if (inBar === 0) drum(t, 'hat', 0.14); }
    else if (sg.hatOn === 'sixteenths') drum(t, 'hat', inBar % 2 ? 0.05 : 0.07);
    else if (sg.hatOn === 'eighths' && inBar % 2 === 0) drum(t, 'hat', 0.06);
    if (sg.halfTime && inBar === 8) drum(t, 'snare', 0.3);
    if (boss && (inBar === 10 || inBar === 14)) drum(t, 'snare', 0.24);

    // ---- guitars play this song's chord vocabulary and rhythm ----
    if (inBar % 2 === 0 && hits[eighth % hits.length]) {
      const open = eighth % 2 === 0;
      const dur = spb * (open ? (sg.style === 'swing' ? 1.1 : 0.85) : 0.15);
      if (open) {
        // strike every voice of this song's chord: triads for the early eras,
        // power chords for the rock eras
        voices.forEach((v, k) => {
          const f = root * semis(v) / 2;
          if (Number.isFinite(f) && f > 0) note(f, t, dur, k === 0 ? 0.19 : 0.13, 'sawtooth', k % 2 ? 5 : -5);
        });
      } else {
        // muted chug, tighter or looser depending on the era
        const f = root * semis(voices[0] || 0) / 2;
        if (Number.isFinite(f) && f > 0) note(f, t, spb * 0.14, 0.14 * (0.6 + mute * 0.5), 'sawtooth', -5);
      }
    }
    // thrash tremolo: rapid pick across the chord root
    if (sg.tremolo && inBar % 2 === 0) {
      const f = root * semis(voices[0] || 0) / 2;
      if (Number.isFinite(f) && f > 0) note(f, t + spb * 0.5, spb * 0.2, 0.08, 'sawtooth', 3);
    }

    // ---- bass: walks for swing, locks with the kick for rock ----
    if (sg.walking) {
      const deg = [0, 2, 4, 5][bar % 4];
      const bf = root * semis(deg) / 4;
      if (inBar % 4 === 0 && Number.isFinite(bf) && bf > 0) bassNote(bf, t, spb * 0.9, 0.26);
    } else if (sg.kick.indexOf(inBar) !== -1 || eighth % 2 === 1) {
      const bf = root * semis(voices[0] || 0) / 4;
      if (Number.isFinite(bf) && bf > 0) bassNote(bf, t, spb * (eighth % 2 === 1 ? 0.22 : 0.52), 0.27);
    }

    if (sg.leadType && step >= sg.leadOn && inBar % 4 === 2) {
      const lf = root * semis(degree((step / 2) + bar)) / 2;
      if (Number.isFinite(lf) && lf > 0) {
        if (sg.leadType === 'sax') note(lf, t, spb * 1.5, 0.13, 'square', 4);
        else if (sg.leadType === 'shred') note(lf * 2, t, spb * 0.45, 0.1, 'sawtooth', 10);

      }
    }
    // a bugle fanfare rather than a solo, for the march
    if (sg.fanfareOn && step >= sg.fanfareOn && inBar % 4 === 0) {
      const seq = [0, 4, 7, 4];
      const lf = root * semis(seq[Math.floor(step / 4) % seq.length]) / 2;
      if (Number.isFinite(lf) && lf > 0) note(lf, t, spb * 0.7, 0.14, 'square', 0);

    if (sg.screechOn && step >= sg.screechOn && inBar % 8 === 6) {
      const lf = root * semis(degree(1) + sg.bend) / 2;
      if (Number.isFinite(lf) && lf > 0) note(lf, t, spb * 1.2, 0.09, 'sawtooth', 30);

      if (Number.isFinite(lf) && lf > 0) note(lf, t, spb * 1.8, 0.15, 'sawtooth', 14);
    }

    music.step = (step + 1) % 64;
    music.nextTime = t + spb * (inBar % 2 === 0 ? (1 + swing) : (1 - swing)) / 2;
  }
  const cutoff = 3000 + (Number.isFinite(score) ? (score % 1000) * 0.6 : 0);
  if (Number.isFinite(cutoff)) {
    try { music.filter.frequency.setTargetAtTime(Math.min(11000, cutoff), actx.currentTime, 0.4); } catch (err) {}
  }
}

// Files are streamed from the user's own Drive folder and looped. If a track fails
// to load, the synthesised score takes over so the game is never silent.
const TRACK_URLS = {
  1914: [
    'https://raw.githubusercontent.com/izzyrios-source/rfree/refs/heads/main/1914.mp3.mp3',
    'https://raw.githubusercontent.com/izzyrios-source/rfree/refs/heads/main/1914.mp3',

  ],

  ],
  2077: [

    'https://raw.githubusercontent.com/izzyrios-source/rfree/refs/heads/main/2077.mp3',
  ],

const trackAudio = {};        // year -> HTMLAudioElement, created on first use
let trackPlaying = null;      // the year currently playing
let realMusicMuted = false;

// A track's own gain node, so the music button and the overall level both apply.
let musicBusReal = null;
function realMusicBus() {
  if (musicBusReal || !actx) return musicBusReal;
  musicBusReal = actx.createGain();
  musicBusReal.gain.value = 0.9;
  musicBusReal.connect(comp);
  return musicBusReal;
}
// Each year has a list of candidate URLs; the first that loads wins. A renamed or
// moved file therefore falls through to the next spelling instead of going silent.
function getTrack(year) {
  if (trackAudio[year] !== undefined) return trackAudio[year];
  const urls = TRACK_URLS[year];
  if (!urls || !urls.length) { trackAudio[year] = null; return null; }
  const a = new Audio();
  a.loop = true;                 // every track loops, as chosen
  a.preload = 'auto';
  a.volume = 0.85;
  let idx = 0;
  a.src = urls[0];
  // If this spelling 404s, try the next before giving up on the era.
  a.addEventListener('error', () => {
    idx++;
    if (idx < urls.length) { a.src = urls[idx]; try { a.load(); } catch (err) {} }
    else { trackAudio[year] = null; }
  });
  trackAudio[year] = a;
  return a;
}
// Warm the era's track while the level loads, so it is ready when the warp lands.
function preloadTrack(year) { const a = getTrack(year); if (a) { try { a.load(); } catch (err) {} } }
function playTrackForEra(year) {
  if (realMusicMuted || !actx) return;
  const want = getTrack(year);
  if (!want) { if (!musicMuted) musicStart(); return; }
  if (trackPlaying === year && !want.paused) return;
  // stop whatever was playing, then start the new era's track from the top
  for (const y of Object.keys(trackAudio)) {
    const a = trackAudio[y];
    if (a && !a.paused) { try { a.pause(); a.currentTime = 0; } catch (err) {} }
  }
  // stand the synth score down first, so the two never overlap
  musicStop();
  const attempt = (retry) => {
    const p = want.play();
    if (p && p.catch) p.catch(() => {
      if (retry > 0) setTimeout(() => attempt(retry - 1), 700);
      else {
        // the track would not start at all: give the synth back so we are not silent
        trackPlaying = null;
        if (!musicMuted) musicStart();
      }
    });
  };
  attempt(2);
  trackPlaying = year;
}
function stopRealMusic() {
  for (const y of Object.keys(trackAudio)) {
    const a = trackAudio[y];
    if (a && !a.paused) { try { a.pause(); } catch (err) {} }
  }
  trackPlaying = null;
}

// ---------- Comfort vignette ----------

  if (!vignette || !renderer.xr.isPresenting) { vigRing.material.opacity = 0; return; }

  const want = Math.max(0, Math.min(1, (turnAmount - 0.35) / 0.65)) * 0.75;

    for (let i = 16; i >= 0; i--) {

      add(wingGeo(1.3, 1.1, 0.4, -0.5, 0.08), body, 0, 0, L / 2 - 0.6);

      add(new THREE.SphereGeometry(0.38, 16, 10), glass, 0, 0.36, -L * 0.18).scale.set(1, 0.8, 2.6);
      add(new THREE.CylinderGeometry(0.36, 0.42, 0.5, 14, 1, true), dark, 0, 0, L / 2 + 0.1).rotation.x = Math.PI / 2;
      add(new THREE.ConeGeometry(0.3, 1.8, 12, 1, true), glow, 0, 0, L / 2 + 1.1).rotation.x = Math.PI / 2;
      for (const s of [-1, 1]) add(new THREE.CircleGeometry(0.35, 20), roundelMat, s * 1.6, 0.0, 1.2).rotation.x = -Math.PI / 2;
    } else {
      const wy = -0.25;

      if (shape === 'biplane') {
        add(wingGeo(3.4, 1.4, 0.8, 0.05, 0.12), body, 0, 1.0, -0.7);
        for (const s of [-1, 1]) for (const zz of [-1.0, -0.2]) add(new THREE.CylinderGeometry(0.04, 0.04, 1.25, 6), dark, s * 2.2, 0.375, zz);

      }

      add(finGeo(1.1, 0.9, 0.07), body, 0, 0.1, L / 2 - 0.4);
      add(new THREE.ConeGeometry(0.2, 0.45, 12), dark, 0, 0, -L / 2 - 0.15).rotation.x = -Math.PI / 2;
      const prop = new THREE.Group(); prop.position.set(0, 0, -L / 2 - 0.08); prop.userData.prop = true; g.add(prop);
      for (let k = 0; k < 3; k++) {
        const piv = new THREE.Group(); piv.rotation.z = k * Math.PI * 2 / 3; prop.add(piv);

    }
  }
  g.scale.setScalar(scale);

function dialTex(label, col) {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const x = c.getContext('2d');
  x.fillStyle = '#06080a'; x.fillRect(0, 0, 128, 128);
  x.strokeStyle = '#c9cfd6'; x.lineWidth = 4; x.beginPath(); x.arc(64, 64, 56, 0, Math.PI * 2); x.stroke();
  x.strokeStyle = '#5b6673'; x.lineWidth = 2;
  for (let k = 0; k <= 24; k++) {
    const ang = Math.PI * 0.78 + (k / 24) * Math.PI * 1.44;
    const r1 = 46, r2 = k % 6 === 0 ? 33 : 39;
    x.beginPath();
    x.moveTo(64 + Math.cos(ang) * r1, 64 + Math.sin(ang) * r1);
    x.lineTo(64 + Math.cos(ang) * r2, 64 + Math.sin(ang) * r2);
    x.stroke();
  }
  x.strokeStyle = col || '#33ff99'; x.lineWidth = 4;
  x.beginPath(); x.moveTo(64, 64); x.lineTo(64 + Math.cos(-0.75) * 36, 64 + Math.sin(-0.75) * 36); x.stroke();
  x.fillStyle = '#e8edf2'; x.beginPath(); x.arc(64, 64, 5, 0, Math.PI * 2); x.fill();
  x.font = 'bold 12px monospace'; x.fillStyle = '#8b96a3'; x.fillText(label, 42, 118);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
function makeDial(label, col, r) {
  const g = new THREE.Group();
  const bez = new THREE.Mesh(new THREE.CylinderGeometry(r * 1.16, r * 1.22, r * 0.4, 24), trimMat);
  bez.rotation.x = Math.PI / 2;

}

  });
}
function roadLineA(x) { return GROUND_R * 0.35 + GROUND_R * 0.10 * Math.sin(x / (GROUND_R / 8)); }
function roadLineB(y) { return GROUND_R * 0.28 + GROUND_R * 0.09 * Math.cos(y / (GROUND_R / 9)); }
function updateCars(dt) {
  for (const c of cars) {
    c.pos += c.speed * dt;
    if (c.pos > GROUND_R) c.pos -= GROUND_R * 2;
    else if (c.pos < -GROUND_R) c.pos += GROUND_R * 2;

// A handful of effects per frame instead of all at once

// ---------- Explosions ----------
// Explosions animate on their own timers, so however heavy a frame gets, every
// sprite is still removed and every material still disposed
function explode(pos, size) {
  sfxBoom(pos, size);
  const born = performance.now();
  const heavy = size > 1.5;
  // Everything is scaled up hard: blasts should fill the sky, not puff politely.
  const K = heavy ? 3.4 : 2.4;

  // 1. fireball core: several stacked spheres of light
  const cores = heavy ? 5 : 3;
  for (let c = 0; c < cores; c++) {
    const cm = new THREE.Sprite(new THREE.SpriteMaterial({
      map: fireTex, color: c === 0 ? 0xfff8e0 : c % 2 ? 0xffc255 : 0xff8a20,
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, toneMapped: false }));
    cm.position.copy(pos);
    cm.position.x += (Math.random() - 0.5) * size * 3;
    cm.position.y += (Math.random() - 0.5) * size * 3;
    cm.position.z += (Math.random() - 0.5) * size * 3;
    const sc = (heavy ? 12 : 8) * size * (1 - c * 0.1);
    cm.scale.setScalar(sc);
    scene.add(cm);
    particles.push({ mesh: cm, vel: new THREE.Vector3().randomDirection().multiplyScalar(3 * size),
      life: 0.6 + Math.random() * 0.3, born, last: born, startScale: sc, smoke: false, grow: 1.5 });
  }

  // 2. shockwave ring, now wide enough to read across the whole view
  const ring = new THREE.Mesh(new THREE.RingGeometry(0.7, 1.0, 40),
    new THREE.MeshBasicMaterial({ color: 0xffe2b0, transparent: true, opacity: 0.8,
      side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false }));
  ring.position.copy(pos);
  ring.lookAt(camera.getWorldPosition(new THREE.Vector3()));
  scene.add(ring);
  particles.push({ mesh: ring, vel: new THREE.Vector3(), life: 0.6, born, last: born,
    startScale: size * 10, smoke: false, grow: 9.0 });

  // 3. rolling fire and smoke cloud, big and slow
  const n = Math.floor((heavy ? 34 : 22) * size) + 14;
  for (let k = 0; k < n; k++) {
    const smoke = k % 3 === 0;
    const mat = new THREE.SpriteMaterial(smoke
      ? { map: puff, color: k % 6 === 0 ? 0x141414 : 0x333333, transparent: true, depthWrite: false, opacity: 0.9 }
      : { map: fireTex, color: k % 2 ? 0xff8a10 : 0xffdd90, transparent: true, depthWrite: false,
          blending: THREE.AdditiveBlending, toneMapped: false });
    const m = new THREE.Sprite(mat);
    m.position.copy(pos);
    m.scale.setScalar((smoke ? 9 : 6) * size * K * 0.5);
    scene.add(m);
    const vel = new THREE.Vector3().randomDirection().multiplyScalar((6 + Math.random() * (smoke ? 10 : 24)) * size);
    particles.push({ mesh: m, vel, life: smoke ? 2.8 : 1.5, born, last: born,
      startScale: (smoke ? 9 : 6) * size * K * 0.5, smoke, grow: smoke ? 2.4 : 1.6 });
  }

  // 4. sparks: long fast streaks thrown clear of the blast
  for (let k = 0; k < Math.floor(26 * size); k++) {
    const sm = new THREE.Sprite(new THREE.SpriteMaterial({
      map: glowTex, color: k % 3 ? 0xfff0b0 : 0xffc060, transparent: true, depthWrite: false,
      blending: THREE.AdditiveBlending, toneMapped: false }));
    sm.position.copy(pos);
    sm.scale.setScalar(0.9 * size);
    scene.add(sm);
    const vel = new THREE.Vector3().randomDirection().multiplyScalar((26 + Math.random() * 46) * size);
    particles.push({ mesh: sm, vel, life: 0.85, born, last: born, startScale: 0.9 * size, smoke: false, grow: 0.5 });
  }

  // 5. heavy tumbling wreckage
  for (let k = 0; k < (heavy ? 16 : 8); k++) {
    const d = new THREE.Mesh(new THREE.BoxGeometry(0.9 * size, 0.4 * size, 0.6 * size),
      new THREE.MeshStandardMaterial({ color: 0x3a3a3a, metalness: 0.75, roughness: 0.55 }));
    d.position.copy(pos);
    scene.add(d);
    const vel = new THREE.Vector3().randomDirection().multiplyScalar((14 + Math.random() * 22) * size);
    vel.y += 6 * size;
    particles.push({ mesh: d, vel, life: 2.4, born, last: born, startScale: 1, smoke: false,
      grow: 1, spin: new THREE.Vector3(Math.random() * 8 - 4, Math.random() * 8 - 4, Math.random() * 8 - 4) });
  }

  // 6. a long mushrooming smoke column that drifts and swells
  for (let k = 0; k < (heavy ? 12 : 6); k++) {
    const sm = new THREE.Sprite(new THREE.SpriteMaterial({
      map: puff, color: 0x1c1c1c, transparent: true, depthWrite: false, opacity: 0.75 }));
    sm.position.copy(pos);
    sm.position.y += k * 1.6 * size;
    sm.scale.setScalar((7 + k * 1.4) * size);
    scene.add(sm);
    particles.push({ mesh: sm, vel: new THREE.Vector3(0, 3 + Math.random() * 3, 0).multiplyScalar(size),
      life: 3.4, born, last: born, startScale: (7 + k * 1.4) * size, smoke: true, grow: 1.9 });
  }

  // 7. the blinding flash

    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, toneMapped: false }));
  fl.position.copy(pos);
  fl.scale.setScalar((heavy ? 60 : 34) * size);
  scene.add(fl);

    startScale: (heavy ? 60 : 34) * size, smoke: false, grow: 0.7 });
}

// Hard guarantee nothing is ever left behind, whatever the frame rate did
function updateParticles(now) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const pt = particles[i];
    const age = (now - pt.born) / 1000;
    if (age >= pt.life) { removeParticle(i); continue; }
    const dt = Math.min(0.05, Math.max(0, (now - pt.last) / 1000));
    pt.last = now;
    pt.vel.multiplyScalar(1 - (pt.smoke ? 1.5 : 3.5) * dt);
    if (!pt.smoke) pt.vel.y -= 6 * dt;                 // fire and sparks fall away
    pt.mesh.position.addScaledVector(pt.vel, dt);
    const fade = Math.max(0, 1 - age / pt.life);
    pt.mesh.material.opacity = fade * (pt.smoke ? 0.85 : 1);
    pt.mesh.scale.setScalar(pt.startScale * (1 + age * (pt.grow || 1.5)));
    if (pt.spin) {
      pt.mesh.rotation.x += pt.spin.x * dt;
      pt.mesh.rotation.y += pt.spin.y * dt;
      pt.mesh.rotation.z += pt.spin.z * dt;
    }
  }
}
function removeParticle(i) {
  const pt = particles[i];
  scene.remove(pt.mesh);
  pt.mesh.material.dispose();
  particles.splice(i, 1);
}

function steerAndMove(e, target, turn, dt) {
  tmpV.copy(target).sub(e.mesh.position).normalize();
  e.dir.lerp(tmpV, Math.min(1, turn * dt)).normalize();
  e.mesh.position.addScaledVector(e.dir, e.speed * dt);
  e.mesh.lookAt(tmpV.copy(e.mesh.position).sub(e.dir));
  e.mesh.traverse(o => { if (o.userData.prop) o.rotation.z += dt * 40; });
}

function enemyFire(from, spread, speed) {
  const lead = headPos.clone().addScaledVector(playerVel, 0.8);
  const d = lead.sub(from).normalize();
  d.x += (Math.random() - 0.5) * spread; d.y += (Math.random() - 0.5) * spread; d.z += (Math.random() - 0.5) * spread;
  spawnBullet(from, d.normalize().multiplyScalar(speed), true);
}

function hitPlayer() {
  if (invuln > 0 || state !== 'play') return;
  // Three hits per life: the hull takes the damage first, then a life is lost
  hull--;
  invuln = hull > 0 ? 1.4 : 2.5;
  flash.material.opacity = hull > 0 ? 0.35 : 0.6;
  sfxDamage();
  const hitPos = headPos.clone().add(new THREE.Vector3(0, -2, -4).applyQuaternion(player.quaternion));
  explode(hitPos, hull > 0 ? 0.6 : 1);
  if (hull > 0) return;
  hull = HITS_PER_LIFE;
  lives--;
  if (lives <= 0) {
    lastEraIndex = eraIndex; lastLoopCount = loopCount;
    state = 'over'; stateTimer = 1.5;
    sfxAlarm(3, 400, 120);
    musicStop();
    stopRealMusic();
    showMessage(credits > 0 ? 'GAME OVER - FIRE TO CONTINUE' : 'GAME OVER - FIRE FOR NEW GAME', 9999);
  }
}

// ---------- Warp jump: the sky stretches into soft streaks of light ----------
let warp = null;
const WARP_MS = 6200;
function startWarp(toYear) {
  // Star streaks drawn as soft glowing sprites, not thin meshes, so nothing reads
  // as wireframe: each is a light with a falloff, stretched along its own path.
  const streakTex = (() => {
    const cc = document.createElement('canvas'); cc.width = 256; cc.height = 16;
    const g = cc.getContext('2d');
    const lin = g.createLinearGradient(0, 0, 256, 0);
    lin.addColorStop(0, 'rgba(255,255,255,0)');
    lin.addColorStop(0.55, 'rgba(200,230,255,0.55)');
    lin.addColorStop(0.85, 'rgba(255,255,255,1)');
    lin.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = lin; g.fillRect(0, 0, 256, 16);
    const t = new THREE.CanvasTexture(cc); t.colorSpace = THREE.SRGBColorSpace; return t;
  })();
  const streaks = [];
  for (let i = 0; i < 300; i++) {
    const dir = new THREE.Vector3().randomDirection();
    const mat = new THREE.SpriteMaterial({
      map: streakTex, color: i % 5 === 0 ? 0xa8d4ff : 0xffffff,
      transparent: true, opacity: 0,
      blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false });
    const m = new THREE.Sprite(mat);
    const startDist = 16 + Math.random() * 240;
    m.position.copy(dir).multiplyScalar(startDist);
    m.visible = false;
    // a sprite cannot be told to stretch, so it is scaled wide and thin and then
    // rotated to lie along its own direction of travel
    m.material.rotation = 0;
    player.add(m);
    streaks.push({ mesh: m, dir, start: startDist, spin: (Math.random() - 0.5) * 0.4, phase: Math.random() });
  }
  // A soft light tunnel: concentric glow rings made of sprites, no hard edges
  const rings = [];
  for (let i = 0; i < 16; i++) {
    const rm = new THREE.Sprite(new THREE.SpriteMaterial({
      map: glowTex, color: i % 3 === 0 ? 0x9fd0ff : 0x5f90e0, transparent: true, opacity: 0,
      blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false }));
    rm.scale.setScalar(120);
    rm.position.set(0, 0, -i * 110);
    rm.visible = false;
    player.add(rm);
    rings.push(rm);
  }
  const core = new THREE.Sprite(new THREE.SpriteMaterial({
    map: glowTex, color: 0xcfeaff, transparent: true, opacity: 0,
    blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false }));
  core.scale.setScalar(1);
  player.add(core);
  const veil = new THREE.Sprite(new THREE.SpriteMaterial({
    map: glowTex, color: 0xdfeeff, transparent: true, opacity: 0,
    blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false }));
  veil.scale.setScalar(1400);
  player.add(veil);
  warp = { t: 0, streaks, core, rings, veil, toYear, switched: false, spun: 0 };
  flash.material.color.setHex(0xffffff); flash.material.opacity = 0;
  showMessage('ENGAGING TIME WARP', 2.6);
}
function updateWarp(dt) {
  if (!warp) return;
  warp.t += dt * 1000;
  const p = Math.min(1, warp.t / WARP_MS);
  const rush = p < 0.32 ? Math.pow(p / 0.32, 1.8)
             : p < 0.7  ? 1
             : Math.max(0, 1 - Math.pow((p - 0.7) / 0.3, 1.6));
  const fade = p < 0.1 ? p / 0.1 : p > 0.9 ? Math.max(0, 1 - (p - 0.9) / 0.1) : 1;

  if (!warp.switched && p >= 0.52) {
    warp.switched = true;
    applyEra();
    showMessage('TIME WARP >> ' + era().year, 2.6);
    sfxWarp();
    playTrackForEra(era().year);
  }

  for (const st of warp.streaks) {
    const m = st.mesh;
    m.visible = rush > 0.02;
    if (!m.visible) continue;
    const travel = rush * 330;
    m.position.copy(st.dir).multiplyScalar(st.start * (1 + rush * 0.5) + travel);
    // scale the sprite long along one axis and rotate it to match its travel path
    const len = 6 + rush * 150;
    m.scale.set(len, 1.4 + rush * 5, 1);
    const toCentre = st.dir.clone().negate();
    const ang = Math.atan2(-toCentre.y, Math.hypot(toCentre.x, toCentre.z));
    m.material.rotation = Math.atan2(toCentre.x, toCentre.z) * 0.35 + st.spin + ang * 0.4;
    m.material.opacity = (0.1 + fade * 0.75) * (0.5 + rush * 0.5);
  }

  const ringSpeed = 1050;
  for (const r of warp.rings) {
    r.visible = rush > 0.05;
    if (!r.visible) continue;
    r.position.z += ringSpeed * dt;
    if (r.position.z > 60) r.position.z -= 16 * 110;
    const nearFade = Math.min(1, (60 - r.position.z) / 90);
    r.material.opacity = fade * rush * 0.16 * Math.max(0, nearFade);
    r.scale.setScalar(150 + Math.max(0, nearFade) * 420);
  }

  warp.core.material.opacity = fade * (0.3 + rush * 0.55);
  warp.core.scale.setScalar(40 + rush * 340);
  warp.veil.material.opacity = fade * rush * 0.14;
  warp.spun += dt * (0.22 + rush * 0.8);
  player.rotation.z = Math.sin(warp.spun) * 0.14 * rush;
  flash.material.opacity = Math.max(flash.material.opacity, fade * rush * 0.2);

  if (p >= 1) {
    for (const st of warp.streaks) { player.remove(st.mesh); st.mesh.material.map.dispose(); st.mesh.material.dispose(); }
    for (const r of warp.rings) { player.remove(r); r.material.dispose(); }
    player.remove(warp.core); warp.core.material.dispose();
    player.remove(warp.veil); warp.veil.material.dispose();
    player.rotation.z = 0;
    warp = null;
    flash.material.opacity = 0;
  }
}

function bossDefeated() {
  const now = performance.now();
  explode(boss.mesh.position, 4);
  const bpos = boss.mesh.position.clone();
  const away = headPos.clone().add(new THREE.Vector3(0, -2, -1).applyQuaternion(player.quaternion).multiplyScalar(45));
  queueExplosion(bpos.clone().add(new THREE.Vector3(8, 3, 0)), 2, now + 200);
  queueExplosion(bpos.clone().add(new THREE.Vector3(-9, -4, 4)), 2, now + 420);
  queueExplosion(away, 3, now + 650);
  scene.remove(boss.mesh); boss = null;
  score += 3000 * (eraIndex + 1);
  for (const e of enemies) { queueExplosion(e.mesh.position, 0.6, now + 120 + Math.random() * 500); scene.remove(e.mesh); }
  enemies.length = 0;
  eraIndex++;
  if (eraIndex >= ERAS.length) { eraIndex = 0; loopCount++; }
  kills = 0;
  startWarp(era().year);
  flashRestoreAt = 0;
}

function drawHUD() {
  const c = hctx;
  c.clearRect(0, 0, 1024, 512);
  c.fillStyle = 'rgba(2,14,20,0.72)'; c.fillRect(0, 0, 1024, 512);

  // bezel
  c.strokeStyle = '#0ff'; c.lineWidth = 4; c.strokeRect(4, 4, 1016, 504);
  c.strokeStyle = 'rgba(0,255,255,0.35)'; c.lineWidth = 2; c.strokeRect(16, 16, 992, 480);
  c.fillStyle = 'rgba(0,255,255,0.08)';
  c.fillRect(16, 16, 992, 42);
  c.fillStyle = '#0ff'; c.font = 'bold 22px monospace';
  c.fillText('C H R O N O   A C E', 34, 45);
  c.textAlign = 'right';
  c.fillText('FLIGHT DECK', 994, 45);
  c.textAlign = 'left';

  // score / era / credits column
  c.fillStyle = '#0ff'; c.font = 'bold 50px monospace';
  c.fillText('SCORE', 34, 116);
  c.fillStyle = '#fff'; c.fillText(String(score).padStart(6, '0'), 250, 116);
  c.fillStyle = '#0ff'; c.font = 'bold 30px monospace';
  c.fillText('ERA', 34, 166);
  c.fillStyle = '#9ff'; c.fillText(era().year + (loopCount ? '  LOOP ' + loopCount : ''), 130, 166);
  c.fillStyle = '#0ff'; c.fillText('CREDITS', 34, 208);
  c.fillStyle = credits > 0 ? '#7cffb0' : '#ff6a5a';
  c.fillText(credits > 0 ? String(credits) : 'NONE', 200, 208);

  // lives as aircraft pips
  // LIVES row: label, then pips, then the hull readout clear of them
  c.fillStyle = '#0ff'; c.font = 'bold 30px monospace';
  c.fillText('LIVES', 34, 256);
  const pipStart = 200, pipGap = 40;
  for (let i = 0; i < Math.max(lives, 0); i++) {
    const x = pipStart + i * pipGap, y = 248;
    c.fillStyle = i < lives ? '#7cffb0' : '#204040';
    c.beginPath();
    c.moveTo(x, y - 13); c.lineTo(x + 13, y); c.lineTo(x, y + 13); c.lineTo(x - 13, y);
    c.closePath(); c.fill();
  }
  // hull sits to the right of the pips, in its own column
  const hullX = pipStart + Math.max(lives, 1) * pipGap + 26;
  c.fillStyle = '#0ff'; c.font = 'bold 26px monospace';
  c.fillText('HULL', hullX, 256);
  c.fillStyle = hull > 1 ? '#7cffb0' : '#ff8a5a';
  c.fillText(Math.max(0, hull) + '/' + HITS_PER_LIFE, hullX + 84, 256);

  // progress bar: kills to the boss, then boss health
  const bx = 34, by = 296, bw = 462, bh = 28;
  c.strokeStyle = '#0ff'; c.lineWidth = 3; c.strokeRect(bx, by, bw, bh);
  const frac = boss ? boss.hp / boss.maxHp : Math.min(1, kills / KILLS_FOR_BOSS);
  c.fillStyle = boss ? '#ff4433' : '#22d3a0';
  c.fillRect(bx + 3, by + 3, (bw - 6) * frac, bh - 6);
  c.fillStyle = '#0ff'; c.font = 'bold 24px monospace';
  c.fillText(boss ? 'BOSS  ' + Math.max(0, boss.hp) + '/' + boss.maxHp : 'KILLS ' + kills + '/' + KILLS_FOR_BOSS, bx, by + 62);

  // status message
  if (messageTimer > 0) {
    c.font = 'bold 40px monospace';
    c.fillStyle = (Math.floor(performance.now() / 300) % 2) ? '#ff0' : '#fff';
    c.fillText(message, 34, 420, 560);
  }

  // radar with sweep, rings and bearing ticks
  const cx = 790, cy = 258, R = 218, range = 340;
  c.save();
  c.beginPath(); c.arc(cx, cy, R, 0, Math.PI * 2);
  c.fillStyle = 'rgba(0,60,70,0.5)'; c.fill();
  c.clip();
  const sweep = (performance.now() / 1000) % (Math.PI * 2);
  c.fillStyle = 'rgba(0,255,255,0.18)';
  c.beginPath(); c.moveTo(cx, cy);
  c.arc(cx, cy, R, sweep - 0.55, sweep); c.closePath(); c.fill();
  c.restore();
  c.strokeStyle = '#0ff'; c.lineWidth = 3;
  c.beginPath(); c.arc(cx, cy, R, 0, Math.PI * 2); c.stroke();
  c.lineWidth = 1.5; c.strokeStyle = 'rgba(0,255,255,0.45)';
  for (const r of [R / 4, R / 2, R * 3 / 4]) { c.beginPath(); c.arc(cx, cy, r, 0, Math.PI * 2); c.stroke(); }
  // bearing ticks around the rim, every 30 degrees
  c.strokeStyle = 'rgba(0,255,255,0.6)'; c.lineWidth = 2;
  for (let k = 0; k < 12; k++) {
    const a = k / 12 * Math.PI * 2;
    c.beginPath();
    c.moveTo(cx + Math.cos(a) * (R - 12), cy + Math.sin(a) * (R - 12));
    c.lineTo(cx + Math.cos(a) * R, cy + Math.sin(a) * R);
    c.stroke();
  }
  c.beginPath(); c.moveTo(cx - R, cy); c.lineTo(cx + R, cy); c.moveTo(cx, cy - R); c.lineTo(cx, cy + R); c.stroke();
  c.fillStyle = '#0ff'; c.font = 'bold 24px monospace';
  c.textAlign = 'center';
  c.fillText('FWD', cx, cy - R - 16);
  c.textAlign = 'left';
  c.fillStyle = '#0ff';
  c.beginPath(); c.moveTo(cx, cy - 18); c.lineTo(cx - 14, cy + 14); c.lineTo(cx + 14, cy + 14); c.closePath(); c.fill();
  const plot = (obj, color, size) => {
    const l = player.worldToLocal(tmpV.copy(obj.position));
    let x = l.x / range * R, y = l.z / range * R;
    const d = Math.hypot(x, y);
    if (d > R - size) { x *= (R - size) / d; y *= (R - size) / d; }
    c.fillStyle = color; c.beginPath(); c.arc(cx + x, cy + y, size, 0, Math.PI * 2); c.fill();
  };
  for (const e of enemies) plot(e.mesh, '#ffd23f', 12);
  if (boss) plot(boss.mesh, '#ff4433', 22);
  // range scale under the dial
  c.fillStyle = 'rgba(0,255,255,0.65)'; c.font = 'bold 20px monospace';
  c.textAlign = 'center';
  c.fillText('RANGE ' + range, cx, cy + R + 34);
  c.textAlign = 'left';

  // dashboard warning lamps: more of them lit as the danger rises
  const litCount = state !== 'play' ? 1 : Math.min(lamps.length, 1 + Math.round((boss ? 2 : 0) + lives / START_LIVES * 2));
  for (let i = 0; i < lamps.length; i++) {
    const on = i < litCount;
    lamps[i].material = i < 2 ? (on ? ledMat : dimMat) : i < 4 ? (on ? amberMat : dimMat) : (on ? warnMat : dimMat);
    if (on !== lamps[i].userData.on) {
      lamps[i].userData.on = on;
      lamps[i].scale.setScalar(on ? 1 : 0.6);
    }
  }
  c.fillStyle = 'rgba(0,255,255,0.55)';
  c.font = 'bold 18px monospace';
  c.textAlign = 'center';
  c.fillText('CONTROLS', 512, 418);
  c.textAlign = 'left';
  drawPerf(c);
  drawButtons(c);
  hudTex.needsUpdate = true;
}

// ---------- Frame rate counter ----------
// Shows displayed FPS and the average frame time. In VR the frame time is the
// number that matters: 11.1 ms is the budget for 90 fps, 16.7 ms is 60 fps.
const perf = { frames: 0, last: performance.now(), fps: 0, msAvg: 0, msSamples: [], worst: 0 };
function perfTick(nowMs) {
  perf.frames++;
  const elapsed = nowMs - perf.last;
  if (elapsed >= 500) {
    perf.fps = Math.round((perf.frames * 1000) / elapsed);
    perf.frames = 0;
    perf.last = nowMs;
  }
}
// Called with the frame's own build cost, so we can show the real budget usage
function perfFrame(ms) {
  perf.msSamples.push(ms);
  if (perf.msSamples.length > 40) perf.msSamples.shift();
  const sum = perf.msSamples.reduce((a, b) => a + b, 0);
  perf.msAvg = sum / perf.msSamples.length;
  perf.worst = Math.max(perf.worst, ms);
}
function drawPerf(c) {
  const fps = perf.fps || 0;
  const ms = perf.msAvg || 0;
  // green at 90+, amber below it, red under 60
  const col = fps >= 85 ? '#7cffb0' : fps >= 55 ? '#ffcc55' : '#ff6a5a';
  // Placed in the left column, below the credits row, where the panel faces the eye.
  c.fillStyle = 'rgba(2,14,20,0.8)';
  c.fillRect(34, 300, 300, 62);
  c.strokeStyle = col; c.lineWidth = 2;
  c.strokeRect(34, 300, 300, 62);
  c.textAlign = 'left';
  c.fillStyle = col; c.font = 'bold 30px monospace';
  c.fillText(fps + ' FPS', 48, 332);
  c.fillStyle = ms <= 11.1 ? '#7cffb0' : ms <= 16.7 ? '#ffcc55' : '#ff6a5a';
  c.font = 'bold 26px monospace';
  c.fillText(ms.toFixed(1) + ' ms', 200, 332);
  c.fillStyle = '#6fb8c8'; c.font = 'bold 16px monospace';
  c.fillText('90 fps budget = 11.1 ms', 48, 354);
}

// ---------- Main loop ----------
const clock = new THREE.Clock();
let frame = 0;
const dead = v => Math.abs(v) < 0.15 ? 0 : v;

let lastError = null;
function gameFrame() {
  const frameStart = performance.now();
  const dt = Math.min(clock.getDelta(), 0.05);
  frame++;
  perfTick(frameStart);
  const inVR = renderer.xr.isPresenting;
  crosshair.visible = !inVR;
  document.getElementById('help').style.display = inVR ? 'none' : 'block';

  // --- input ---
  let steerX = 0, steerY = 0, fire = mouseDown || !!keys.Space, aimObj = camera;
  if (keys.KeyA || keys.ArrowLeft) steerX -= 1;
  if (keys.KeyD || keys.ArrowRight) steerX += 1;
  if (keys.KeyW || keys.ArrowUp) steerY += 1;
  if (keys.KeyS || keys.ArrowDown) steerY -= 1;
  yaw -= mouseDX * 0.002; pitch -= mouseDY * 0.002; mouseDX = mouseDY = 0;
  for (const c of controllers) {
    const gp = c.userData.gamepad;
    if (!gp) continue;
    const ax = gp.axes;
    const x = dead(ax.length >= 4 ? ax[2] : (ax[0] || 0));
    const y = dead(ax.length >= 4 ? ax[3] : (ax[1] || 0));
    if (c.userData.hand === 'left') { steerX += x; steerY += y; }
    else { steerX += x * 0.5; }
    if (gp.buttons[0] && gp.buttons[0].pressed) { fire = true; aimObj = c; }
  }

  // --- flight --- (the ship flies straight and level through a warp jump)
  if (warp) {
    playerVel.set(0, 0, -PLAYER_SPEED);
    const fwdW = tmpV.set(0, 0, -1).applyQuaternion(player.quaternion);
    player.position.addScaledVector(fwdW, PLAYER_SPEED * dt * 1.6);
    yaw = player.rotation.y; pitch = player.rotation.x; bank = player.rotation.z;
  } else if (state === 'play' || state === 'title') {
    // Full 360: no pitch limit, so pulling back carries you over the top and round.
    // Snap turning: hold the stick and the view rotates in 30-degree steps rather
    // than sweeping continuously. Much easier on the inner ear.
    if (snapTurn) {
      snapAccum -= steerX * 1.3 * dt;
      if (Math.abs(snapAccum) >= SNAP_STEP) {
        yaw -= Math.sign(snapAccum) * SNAP_STEP;
        snapAccum = 0;
      }
    } else {
      yaw -= steerX * 1.3 * dt;
    }
    pitch += steerY * 1.05 * dt;
    // bank into the turn, and let the bank build the further you hold it
    // Reduced roll: flying flat removes the bank, which is one of the more
    // nauseating motions in a cockpit game.
    const bankTarget = reducedRoll ? 0 : -steerX * 0.85;
    bank += (bankTarget - bank) * Math.min(1, 4 * dt);
    player.rotation.set(pitch, yaw, bank);
    const fwd = tmpV.set(0, 0, -1).applyQuaternion(player.quaternion);
    playerVel.copy(fwd).multiplyScalar(state === 'play' ? PLAYER_SPEED : 10);
    player.position.addScaledVector(playerVel, dt);
  }
  // the ground is no longer flat, so ask the same noise field how high it is here
  const gx = player.position.x, gz = player.position.z;
  const gu = (gx + GROUND_R) / (GROUND_R * 2), gv = (gz + GROUND_R) / (GROUND_R * 2);
  const gpx = gu * 1024, gpy = gv * 1024;
  const gh = fbm(gpx / 300, gpy / 300, 3 + 4.2, 3);
  const gridge = fbm(gpx / 620, gpy / 620, 4.2 + 88, 2);
  const gdetail = fbm(gpx / 60, gpy / 60, 4.2 + 12, 3);
  const groundHere = GROUND_Y + Math.max(0, gh - 0.42) * 62 + Math.max(0, gridge - 0.55) * 90 + (gdetail - 0.5) * 7;
  if (state === 'play' && !warp && player.position.y <= groundHere + 6) {
    const crashPos = player.position.clone();
    explode(crashPos, 2.5);
    sfxDamage();
    sfxAlarm(3, 500, 120);
    lastEraIndex = eraIndex; lastLoopCount = loopCount;
    lives = 0; hull = HITS_PER_LIFE;
    state = 'over'; stateTimer = 1.5;
    musicStop(); stopRealMusic();
    showMessage('YOU CRASHED - FIRE TO ' + (credits > 0 ? 'CONTINUE' : 'RESTART'), 9999);
  }
  camera.getWorldPosition(headPos);
  updateListener();
  setEngine(state === 'play' ? 0.5 : state === 'title' ? 0.35 : 0.2,
    state === 'play' ? PLAYER_SPEED : 12, steerX);

  // --- pause freezes the world: no movement, no spawning, no timers ---
  if (paused) {
    if (frame % 12 === 0) drawHUD();
    renderer.render(scene, camera);
    return;
  }

  // --- state transitions ---
  if (state === 'title' && fire) { initAudio(); newCampaign(); if (!musicMuted) playTrackForEra(era().year); fireCool = 0.4; }
  if (state === 'over') {
    stateTimer -= dt;
    if (stateTimer <= 0 && fire) {
      if (credits > 0) continueCampaign(); else newCampaign();
      if (!musicMuted) playTrackForEra(era().year);
      fireCool = 0.4;
    }
  }

  // --- shooting ---
  fireCool -= dt;
  if (state === 'play' && fire && fireCool <= 0) {
    fireCool = 0.11;
    aimObj.getWorldQuaternion(tmpQ);
    const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(tmpQ);
    const origin = aimObj.getWorldPosition(new THREE.Vector3()).addScaledVector(dir, 1.5);
    if (aimObj === camera) origin.addScaledVector(new THREE.Vector3(0, -1, 0).applyQuaternion(tmpQ), 0.4);
    spawnBullet(origin, dir.multiplyScalar(260).add(playerVel), false);
    sfxShoot(headPos);
  }

  // --- spawning ---
  if (state === 'play') {
    const maxEnemies = 6 + eraIndex * 2 + loopCount * 2;
    if (!boss && enemies.length < maxEnemies && Math.random() < dt * 2) spawnEnemy();
    if (!boss && kills >= KILLS_FOR_BOSS) spawnBoss();
  }

  // --- enemies ---
  const t = performance.now() / 1000;
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    e.offset.applyAxisAngle(THREE.Object3D.DEFAULT_UP, dt * 0.6);
    steerAndMove(e, tmpV.copy(headPos).add(e.offset), 1.2, dt);
    const dist = e.mesh.position.distanceTo(headPos);
    if (dist > 520) { scene.remove(e.mesh); enemies.splice(i, 1); continue; }
    e.cool -= dt;
    if (state === 'play' && e.cool <= 0 && dist < 170) {
      const to = tmpV.copy(headPos).sub(e.mesh.position).normalize();
      if (to.dot(e.dir) > 0.7) { enemyFire(e.mesh.position.clone(), 0.06, 90 + era().speed); e.cool = 1.8 + Math.random() * 2.5; }
    }
    if (dist < 3.5) { killEnemy(i); hitPlayer(); }
  }

  // --- boss ---
  if (boss) {
    boss.angle += dt * 0.35;
    const fwd = new THREE.Vector3(0, 0, -1).applyQuaternion(player.quaternion);
    const target = headPos.clone().addScaledVector(fwd, 90)
      .add(new THREE.Vector3(Math.cos(boss.angle) * 50, Math.sin(boss.angle * 1.3) * 20, Math.sin(boss.angle) * 50));
    steerAndMove(boss, target, 0.8, dt);
    boss.speed = PLAYER_SPEED * 1.1;
    boss.cool -= dt;
    if (state === 'play' && boss.cool <= 0 && boss.mesh.position.distanceTo(headPos) < 250) {
      for (let k = 0; k < 5; k++) enemyFire(boss.mesh.position.clone(), 0.12, 80);
      boss.cool = 1.6 - Math.min(0.8, loopCount * 0.2);
      sfxBeep(boss.mesh.position.distanceTo(headPos) < 120 ? 900 : 620, 0.12, 0.16, 'square');
    }
  }

  // --- bullets ---
  for (const b of bullets) {
    if (!b.alive) continue;
    b.mesh.position.addScaledVector(b.vel, dt);
    b.life -= dt;
    if (b.life <= 0) { b.alive = false; b.mesh.visible = false; continue; }
    const p = b.mesh.position;
    if (b.enemy) {
      if (p.distanceTo(headPos) < 1.6) { b.alive = false; b.mesh.visible = false; hitPlayer(); }
    } else {
      for (let i = enemies.length - 1; i >= 0; i--) {
        if (p.distanceTo(enemies[i].mesh.position) < enemies[i].radius) {
          b.alive = false; b.mesh.visible = false; killEnemy(i); break;
        }
      }
      if (b.alive && boss && p.distanceTo(boss.mesh.position) < boss.radius) {
        b.alive = false; b.mesh.visible = false;
        boss.hp--; score += 50;
        explode(p.clone(), 0.25);
        if (boss.hp <= 0) bossDefeated();
      }
    }
  }

  // --- particles ---
  updateParticles(performance.now());
  updateFxQueue(performance.now());
  musicPump(performance.now());
  updateWarp(dt);
  if (flashRestoreAt && performance.now() >= flashRestoreAt) { flash.material.color.setHex(0xff0000); flashRestoreAt = 0; }

  sky.position.copy(player.position);
  updateCars(dt);
  updateVignette(dt, Math.min(1.4, Math.abs(steerX) + Math.abs(bank) * 0.7));
  // mountains stay put in the world; only the sky follows the player
  for (const e of enemies) e.mesh.traverse(o => { if (o.userData.spinY) o.rotation.y += dt * 2; });
  if (boss) boss.mesh.traverse(o => { if (o.userData.spinY) o.rotation.y += dt * 1.2; });
  // --- clouds wrap around player ---
  for (const cl of clouds) {
    for (const a of ['x', 'y', 'z']) {
      const d = cl.position[a] - player.position[a];
      if (d > CLOUD_R) cl.position[a] -= CLOUD_R * 2;
      else if (d < -CLOUD_R) cl.position[a] += CLOUD_R * 2;
    }
  }

  // --- timers & HUD ---
  if (invuln > 0) { invuln -= dt; cockpit.visible = state !== 'play' || Math.floor(t * 8) % 2 === 0; }
  else cockpit.visible = true;
  flash.material.opacity = Math.max(0, flash.material.opacity - dt * 1.5);
  if (messageTimer > 0 && messageTimer < 9999) messageTimer -= dt;
  // the stick leans with your steering and pitches with your climb
  if (typeof stickBase !== 'undefined' && stickBase) {
    const stickX = Math.max(-1, Math.min(1, steerX));
    const stickY = Math.max(-1, Math.min(1, steerY));
    stickBase.rotation.z += (-stickX * 0.42 - stickBase.rotation.z) * Math.min(1, 12 * dt);
    stickBase.rotation.x += (stickY * 0.5 - stickBase.rotation.x) * Math.min(1, 12 * dt);
  }
  if (frame % 3 === 0) drawHUD();
  renderer.render(scene, camera);
  perfFrame(performance.now() - frameStart);
}
renderer.setAnimationLoop(() => {
  try { gameFrame(); } catch (err) {
    if (err.message !== lastError) {
      lastError = err.message;
      const h = document.getElementById('help');
      if (h) {
        h.style.display = 'block';
        h.innerHTML = '<b>CHRONO ACE VR &mdash; stopped</b><br>' + err.message +
          '<br><span style="opacity:.7">send me this line and I will fix it</span>';
      }
      musicStop();
    }
  }
});

</script>
</body>
