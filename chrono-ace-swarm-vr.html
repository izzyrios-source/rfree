<script type="module">

// =====================================================================
//  CHRONO ACE: SWARM  -  a VR diorama survival shooter
//  The battlefield floats in front of you like a table-top wargame. Your plane
//  fires on its own; you fly to survive, and pick an upgrade every level.
// =====================================================================
import * as THREE from 'three';
import { VRButton } from 'three/addons/webxr/VRButton.js';

const scene = new THREE.Scene();
// A blue sky with soft clouds, painted once and used as the scene's backdrop.
const skyTex = (() => {
  const c = document.createElement('canvas'); c.width = 1024; c.height = 512;
  const x = c.getContext('2d');
  // the sky itself: deeper blue at the top, paler toward the horizon
  const g = x.createLinearGradient(0, 0, 0, 512);
  g.addColorStop(0, '#2f6fc4');
  g.addColorStop(0.55, '#6aa7e0');
  g.addColorStop(1, '#cfe6f7');
  x.fillStyle = g; x.fillRect(0, 0, 1024, 512);
  // each puff is a cluster of soft circles, so it reads as cloud rather than a blob
  const puff = (cx, cy, r, a) => {
    const rg = x.createRadialGradient(cx, cy, 0, cx, cy, r);
    rg.addColorStop(0, 'rgba(255,255,255,' + a + ')');
    rg.addColorStop(0.55, 'rgba(255,255,255,' + a * 0.75 + ')');
    rg.addColorStop(1, 'rgba(255,255,255,0)');
    x.fillStyle = rg;
    x.beginPath(); x.arc(cx, cy, r, 0, Math.PI * 2); x.fill();
  };
  for (let i = 0; i < 26; i++) {
    const cx = Math.random() * 1024, cy = 40 + Math.random() * 300;
    const r = 26 + Math.random() * 54;
    const lobes = 4 + Math.floor(Math.random() * 4);
    for (let k = 0; k < lobes; k++) {
      const a = (k / lobes) * Math.PI * 2;
      puff(cx + Math.cos(a) * r * 0.7, cy + Math.sin(a) * r * 0.3,
           r * (0.6 + Math.random() * 0.5), 0.5 + Math.random() * 0.4);
    }
    puff(cx, cy, r * 1.1, 0.85);
  }
  // a few thin high wisps near the top
  for (let i = 0; i < 10; i++) {
    const wy = 12 + Math.random() * 120;
    x.strokeStyle = 'rgba(255,255,255,' + (0.15 + Math.random() * 0.2) + ')';
    x.lineWidth = 2 + Math.random() * 5;
    x.beginPath();
    let wx = Math.random() * 900;
    x.moveTo(wx, wy);
    for (let k = 0; k < 5; k++) { wx += 60 + Math.random() * 80; x.lineTo(wx, wy + (Math.random() - 0.5) * 22); }
    x.stroke();
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
})();
scene.background = skyTex;

// ---------- CLOUDS: real cloud objects over the field, so they drift past you ----------
// The board only moves a pixel at a time, so a cloud parented to something that moves
// with the board would appear to sit still. These live in the world instead, and shift
// by the exact amount the board has been carried, which is what makes them stream past.
const cloudLayer = new THREE.Group();
scene.add(cloudLayer);
// one soft white blob, reused for every lobe of every cloud
const cloudBlobTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const x = c.getContext('2d');
  const g = x.createRadialGradient(64, 64, 0, 64, 64, 64);
  g.addColorStop(0, 'rgba(255,255,255,0.95)');
  g.addColorStop(0.5, 'rgba(255,255,255,0.6)');
  g.addColorStop(1, 'rgba(255,255,255,0)');
  x.fillStyle = g; x.fillRect(0, 0, 128, 128);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  return t;
})();
const clouds = [];
const CLOUD_SPAN_X = 7.0;      // how far the sky of clouds reaches, either side
const CLOUD_SPAN_Z = 5.0;
const cloudsPerSky = 14;
function makeCloud() {
  const g = new THREE.Group();
  const lobes = 4 + Math.floor(Math.random() * 4);
  const base = 0.28 + Math.random() * 0.5;
  for (let k = 0; k < lobes; k++) {
    const m = new THREE.Sprite(new THREE.SpriteMaterial({ map: cloudBlobTex,
      transparent: true, depthWrite: false, opacity: 0.35 + Math.random() * 0.4 }));
    const r = base * (0.6 + Math.random() * 0.7);
    m.scale.set(r, r * 0.6, 1);
    m.position.set((k - (lobes - 1) / 2) * base * 0.85 + (Math.random() - 0.5) * base * 0.4,
                   (Math.random() - 0.5) * base * 0.25, 0);
    g.add(m);
  }
  // thin islands of cloud high up, fatter banks lower down
  const layer = Math.random();
  g.userData.y = 0.3 + layer * 1.6;
  g.userData.speed = 0.004 + Math.random() * 0.012;   // a slow breeze, all the same way
  return g;
}
function seedClouds() {
  for (const c of clouds) cloudLayer.remove(c);
  clouds.length = 0;
  for (let i = 0; i < cloudsPerSky; i++) {
    const g = makeCloud();
    g.position.set((Math.random() * 2 - 1) * CLOUD_SPAN_X, g.userData.y,
                   (Math.random() * 2 - 1) * CLOUD_SPAN_Z);
    cloudLayer.add(g);
    clouds.push(g);
  }
}
// clouds stand still in the sky; the ground streaming past underneath is the motion
function driftClouds(dt, camX, camZ) {
  for (const c of clouds) {
    c.position.x -= camX;
    c.position.z -= camZ;
    c.position.x += c.userData.speed * dt;            // a slight breeze on top
    // wrap it round to the far side so the sky never empties
    if (c.position.x > CLOUD_SPAN_X) c.position.x -= CLOUD_SPAN_X * 2;
    if (c.position.x < -CLOUD_SPAN_X) c.position.x += CLOUD_SPAN_X * 2;
    if (c.position.z > CLOUD_SPAN_Z) c.position.z -= CLOUD_SPAN_Z * 2;
    if (c.position.z < -CLOUD_SPAN_Z) c.position.z += CLOUD_SPAN_Z * 2;
  }
}
seedClouds();
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.xr.enabled = true;
renderer.xr.setReferenceSpaceType('local-floor');
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
document.body.appendChild(VRButton.createButton(renderer));

// The rig: everything hangs off this, positioned at seated head height so the
// battlefield sits in front of you like a board on a table.
const rig = new THREE.Group();
scene.add(rig);
const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.05, 200);
camera.position.set(0, 1.35, 0.35);
camera.lookAt(0, 1.05, -0.9);
rig.add(camera);

scene.add(new THREE.HemisphereLight(0xdff0ff, 0x30404f, 1.2));
const key = new THREE.DirectionalLight(0xffffff, 2.0);
key.position.set(1.2, 2.4, 1.0);
scene.add(key);
const rim = new THREE.DirectionalLight(0x88bbff, 0.7);
rim.position.set(-1.4, 1.0, -1.2);
scene.add(rim);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ---------- THE BOARD ----------
// A square arena about two metres across, floating at waist height in front of you.
const ARENA = 1.0;                 // half-depth in world metres
const ARENA_X = 1.6;               // half-width: the field is wider than it is deep
const BOARD_Y = 1.02;              // height of the board above the floor
const board = new THREE.Group();           // the static stage: never moves, so it cannot vanish
board.position.set(0, BOARD_Y, -0.95);
rig.add(board);
const field = new THREE.Group();           // everything that lives on the field and scrolls
board.add(field);

const boardMat = new THREE.MeshStandardMaterial({ color: 0x1d3348, roughness: 0.9, metalness: 0.1 });
const boardMesh = new THREE.Mesh(new THREE.BoxGeometry(ARENA_X * 2, 0.05, ARENA * 2), boardMat);
field.add(boardMesh);
// a raised lip around the edge, so the arena reads as a physical tray
const lipMat = new THREE.MeshStandardMaterial({ color: 0x2c4a63, roughness: 0.6, metalness: 0.4 });
for (const [w, d, x, z] of [[ARENA_X*2+0.08, 0.05, 0, ARENA], [ARENA_X*2+0.08, 0.05, 0, -ARENA],
                             [0.05, ARENA*2+0.08, ARENA_X, 0], [0.05, ARENA*2+0.08, -ARENA_X, 0]]) {
  const e = new THREE.Mesh(new THREE.BoxGeometry(w, 0.07, d), lipMat);
  e.position.set(x, 0.03, z);
  field.add(e);
}
// a grass field painted on a canvas: mottled greens plus thousands of blade strokes
const grassTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 512;
  const x = c.getContext('2d');
  x.fillStyle = '#3f7a2c'; x.fillRect(0, 0, 512, 512);
  for (let i = 0; i < 260; i++) {           // soft patches of lighter and darker turf
    const px = Math.random() * 512, py = Math.random() * 512, r = 20 + Math.random() * 60;
    const g = x.createRadialGradient(px, py, 0, px, py, r);
    const col = Math.random() < 0.5 ? '70,130,45' : '40,90,28';
    g.addColorStop(0, 'rgba(' + col + ',0.35)'); g.addColorStop(1, 'rgba(' + col + ',0)');
    x.fillStyle = g; x.fillRect(px - r, py - r, r * 2, r * 2);
  }
  for (let i = 0; i < 14000; i++) {         // individual blades
    const px = Math.random() * 512, py = Math.random() * 512, l = 2 + Math.random() * 5;
    const v = 90 + Math.random() * 90;
    x.strokeStyle = 'rgba(' + (v * 0.45 | 0) + ',' + (v | 0) + ',' + (v * 0.3 | 0) + ',0.8)';
    x.lineWidth = 1;
    x.beginPath(); x.moveTo(px, py); x.lineTo(px + (Math.random() - 0.5) * 2, py - l); x.stroke();
  }
  // ---- HILLS: soft dark-to-light shading, as though low sun rakes across them ----
  for (let i = 0; i < 22; i++) {
    const hx = Math.random() * 512, hy = Math.random() * 512;
    const rx = 60 + Math.random() * 120, ry = 40 + Math.random() * 80;
    // the lit face of the hill
    let g = x.createRadialGradient(hx, hy, 0, hx, hy, Math.max(rx, ry));
    g.addColorStop(0, 'rgba(150,190,95,0.5)');
    g.addColorStop(0.55, 'rgba(110,160,70,0.3)');
    g.addColorStop(1, 'rgba(90,140,60,0)');
    x.save(); x.translate(hx, hy); x.scale(1, ry / rx); x.translate(-hx, -hy);
    x.fillStyle = g; x.beginPath(); x.arc(hx, hy, rx, 0, Math.PI * 2); x.fill();
    x.restore();
    // its shadowed side, offset down-right
    g = x.createRadialGradient(hx + rx * 0.3, hy + ry * 0.35, 0, hx + rx * 0.3, hy + ry * 0.35, Math.max(rx, ry) * 0.9);
    g.addColorStop(0, 'rgba(22,48,20,0.4)');
    g.addColorStop(1, 'rgba(22,48,20,0)');
    x.save(); x.translate(hx + rx * 0.3, hy + ry * 0.35); x.scale(1, ry / rx); x.translate(-(hx + rx * 0.3), -(hy + ry * 0.35));
    x.fillStyle = g; x.beginPath(); x.arc(hx + rx * 0.3, hy + ry * 0.35, rx * 0.9, 0, Math.PI * 2); x.fill();
    x.restore();
    // a ridge line along the top of the hill
    x.strokeStyle = 'rgba(190,215,130,0.35)'; x.lineWidth = 2 + Math.random() * 2;
    x.beginPath();
    for (let k = 0; k <= 12; k++) {
      const a = Math.PI * (1.08 + k / 12 * 0.84);
      const px2 = hx + Math.cos(a) * rx, py2 = hy - Math.sin(a) * ry;
      k ? x.lineTo(px2, py2) : x.moveTo(px2, py2);
    }
    x.stroke();
  }
  // ---- a few field tracks worn across the hills ----
  for (let i = 0; i < 6; i++) {
    x.strokeStyle = 'rgba(150,130,85,0.25)'; x.lineWidth = 3 + Math.random() * 4;
    x.beginPath();
    let px3 = Math.random() * 512, py3 = Math.random() * 512;
    x.moveTo(px3, py3);
    for (let k = 0; k < 6; k++) {
      px3 += (Math.random() - 0.5) * 160; py3 += (Math.random() - 0.5) * 160;
      x.quadraticCurveTo(px3 + (Math.random() - 0.5) * 80, py3 + (Math.random() - 0.5) * 80, px3, py3);
    }
    x.stroke();
  }
  // ---- a light vignette, so the field reads as a real surface under a sky ----
  const vg = x.createRadialGradient(256, 256, 90, 256, 256, 330);
  vg.addColorStop(0, 'rgba(255,255,220,0.10)');
  vg.addColorStop(1, 'rgba(10,30,15,0.30)');
  x.fillStyle = vg; x.fillRect(0, 0, 512, 512);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  return t;
})();
const grass = new THREE.Mesh(new THREE.PlaneGeometry(ARENA_X * 2, ARENA * 2),
  new THREE.MeshStandardMaterial({ map: grassTex, roughness: 0.95, metalness: 0 }));
grass.rotation.x = -Math.PI / 2;
grass.position.y = 0.0255;
field.add(grass);


const ERAS = [
  { year: 1914, top: 0x3d7fd1, horizon: 0xdcefff, bottom: 0x3c5a34, sun: 0xfff3d6, sunDir: [0.4, 0.5, -0.8], cloud: 0xffffff, shade: 0xc9d3de, color: 0x9b7a48, speed: 20, shape: 'biplane' },
  { year: 1944, top: 0x2f63b0, horizon: 0xbcd8f0, bottom: 0x16384d, sun: 0xfff0d0, sunDir: [-0.5, 0.4, -0.75], cloud: 0xffffff, shade: 0xb8c4d2, color: 0x56703f, speed: 26, shape: 'prop' },
  { year: 1968, top: 0x1d4f9a, horizon: 0xaecbe8, bottom: 0x2a4630, sun: 0xffffff, sunDir: [0.2, 0.7, -0.6], cloud: 0xf4f8ff, shade: 0xaab6c4, color: 0xa8acb0, speed: 34, shape: 'jet' },
  { year: 1991, top: 0x34296a, horizon: 0xff9c5c, bottom: 0x2a1d30, sun: 0xffb070, sunDir: [0.0, 0.08, -1.0], cloud: 0xffd2b0, shade: 0x8a6a80, color: 0x4a4a58, speed: 40, shape: 'jet' },
  { year: 2077, top: 0x07021a, horizon: 0x7a2496, bottom: 0x06021a, sun: 0xff55cc, sunDir: [0.3, 0.15, -0.9], cloud: 0x9a7cff, shade: 0x3a2a70, color: 0x55ffcc, speed: 48, shape: 'saucer' },
];
let eraIndex = 0;
const era = () => ERAS[eraIndex];

// ---------- Shared materials for the aircraft ----------
const bodyMat = new THREE.MeshStandardMaterial({ color: 0xc8302c, roughness: 0.5, metalness: 0.3 });
const trimMat = new THREE.MeshStandardMaterial({ color: 0x2b3038, roughness: 0.45, metalness: 0.8 });
const rivetMat = new THREE.MeshStandardMaterial({ color: 0x7a828a, roughness: 0.3, metalness: 1.0 });
const panelMat = new THREE.MeshStandardMaterial({ color: 0x1b2026, roughness: 0.82, metalness: 0.15 });
const leatherMat = new THREE.MeshStandardMaterial({ color: 0x2a1d15, roughness: 0.96, metalness: 0.02 });
const glassMat = new THREE.MeshStandardMaterial({ color: 0xd6ecff, roughness: 0.02, metalness: 1.0,
  transparent: true, opacity: 0.35, side: THREE.DoubleSide });
const roundelTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const x = c.getContext('2d');
  [['#f4f1e6', 31], ['#b8262d', 24], ['#f4f1e6', 15], ['#1d3c8f', 8]].forEach(([col, r]) => {
    x.fillStyle = col; x.beginPath(); x.arc(32, 32, r, 0, Math.PI * 2); x.fill();
  });
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
})();
const roundelMat = new THREE.MeshStandardMaterial({ map: roundelTex, transparent: true,
  roughness: 0.6, polygonOffset: true, polygonOffsetFactor: -2 });


// Tapered wing: span per side, root chord, tip chord, tip offset (forward +), thickness
function wingGeo(span, root, tip, sweep, th) {
  const s = new THREE.Shape();
  s.moveTo(-span, sweep - tip / 2); s.lineTo(-span, sweep + tip / 2); s.lineTo(0, root / 2);
  s.lineTo(span, sweep + tip / 2); s.lineTo(span, sweep - tip / 2); s.lineTo(0, -root / 2); s.closePath();
  const geo = new THREE.ExtrudeGeometry(s, { depth: th, bevelEnabled: true, bevelThickness: th * 0.4, bevelSize: th * 0.4, bevelSegments: 2 });
  geo.translate(0, 0, -th / 2); geo.rotateX(-Math.PI / 2);
  return geo;
}
function finGeo(len, h, th) {
  const s = new THREE.Shape();
  s.moveTo(len * 0.4, 0); s.lineTo(-len * 0.6, 0); s.lineTo(-len * 0.75, h); s.lineTo(-len * 0.3, h); s.closePath();
  const geo = new THREE.ExtrudeGeometry(s, { depth: th, bevelEnabled: false });
  geo.translate(0, 0, -th / 2); geo.rotateY(Math.PI / 2);
  return geo;
}

function makeAircraft(shape, color, scale) {
  const g = new THREE.Group();
  const jet = shape === 'jet';
  const body = new THREE.MeshStandardMaterial({ color, roughness: jet ? 0.35 : 0.6, metalness: jet || shape === 'saucer' ? 0.7 : 0.1 });
  const dark = new THREE.MeshStandardMaterial({ color: 0x1c1c1c, roughness: 0.5, metalness: 0.5 });
  const glass = new THREE.MeshStandardMaterial({ color: 0x9fd8ff, roughness: 0.05, metalness: 0.9, transparent: true, opacity: 0.8 });
  const glow = new THREE.MeshBasicMaterial({ color: shape === 'saucer' ? 0x66ffee : 0xff9a3a, transparent: true, opacity: 0.85,
    blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false });
  const add = (geo, mat, x = 0, y = 0, z = 0, parent = g) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); parent.add(m); return m; };

  if (shape === 'futuristic') {
    // An F/A-18 style fighter: long fuselage with a pointed nose, leading-edge root
    // extensions running into the wing, two canted vertical tails, twin engines side
    // by side, and side-mounted intakes under the LERX.
    const hull   = new THREE.MeshStandardMaterial({ color: 0x6d747d, roughness: 0.6, metalness: 0.55 });
    const upper  = new THREE.MeshStandardMaterial({ color: 0x565d66, roughness: 0.62, metalness: 0.5 });
    const belly  = new THREE.MeshStandardMaterial({ color: 0x9aa2ab, roughness: 0.65, metalness: 0.45 });
    const dark   = new THREE.MeshStandardMaterial({ color: 0x15191e, roughness: 0.6, metalness: 0.5 });
    const canopyM = new THREE.MeshStandardMaterial({ color: 0x8fc6e8, roughness: 0.04, metalness: 1.0,
      transparent: true, opacity: 0.55 });
    const burner = new THREE.MeshBasicMaterial({ color: 0xff9a40, transparent: true, opacity: 0.8,
      blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false });

    // 1. FUSELAGE: a long tapered body, pointed at the nose, flattening toward the tail.
    const fus = [];
    for (let i = 16; i >= 0; i--) {
      const t = i / 16;                       // 0 = nose, 1 = tail
      const r = t < 0.12 ? 0.16 * Math.pow(t / 0.12, 0.7)
              : t < 0.55 ? 0.16 + 0.34 * ((t - 0.12) / 0.43)
              : 0.50 * (1 - Math.pow((t - 0.55) / 0.45, 1.4) * 0.35);
      fus.push(new THREE.Vector2(Math.max(r, 0.02), -3.8 + t * 7.6));
    }
    const body = add(new THREE.LatheGeometry(fus, 20), hull);
    body.rotation.x = -Math.PI / 2;
    body.scale.set(1.15, 0.72, 1);            // slightly flattened, like a fighter

    // 2. LERX: the long strake running from the cockpit into the wing root. This one
    //    line is what makes an F-18 read as an F-18.
    for (const sx of [-1, 1]) {
      const lerxShape = new THREE.Shape();
      lerxShape.moveTo(0, 0); lerxShape.lineTo(2.0, 0.2);
      lerxShape.lineTo(2.0, 0.6); lerxShape.lineTo(0.1, 0.42);
      lerxShape.closePath();
      const lg = new THREE.ExtrudeGeometry(lerxShape, { depth: 0.08, bevelEnabled: false });
      lg.rotateX(-Math.PI / 2);
      const lerx = add(lg, upper, 0, 0.06, -1.1);
      lerx.scale.x = sx;
      lerx.rotation.y = 0;
    }

    // 3. WINGS: cropped delta with a straight leading edge, slight anhedral.
    for (const sx of [-1, 1]) {
      const w = add(wingGeo(2.9, 3.0, 0.7, -1.5, 0.09), upper, 0, 0.0, 0.35);
      w.scale.x = sx;
      w.rotation.z = 0.05 * sx;
      // wingtip missile rail
      add(new THREE.BoxGeometry(0.16, 0.16, 1.5), dark, sx * 2.85, 0.04, 0.9);
    }

    // 4. CANTED TWIN TAILS: angled outward about fifteen degrees, the Hornet signature.
    for (const sx of [-1, 1]) {
      const fin = add(finGeo(1.9, 1.6, 0.07), upper, sx * 0.72, 0.22, 2.6);
      fin.rotation.z = -0.26 * sx;
      // small ventral fin below
      add(new THREE.BoxGeometry(0.5, 0.4, 1.0), upper, sx * 0.5, -0.38, 2.3);
    }

    // 5. HORIZONTAL STABILISERS: small, well back, slightly swept.
    for (const sx of [-1, 1]) {
      const st = add(wingGeo(1.5, 1.3, 0.4, -0.6, 0.07), upper, sx * 0.5, 0.02, 3.0);
      st.scale.x = sx;
    }

    // 6. BUBBLE CANOPY, set forward on the spine.
    add(new THREE.SphereGeometry(0.38, 16, 12, 0, Math.PI * 2, 0, Math.PI * 0.55), canopyM, 0, 0.30, -1.5)
      .scale.set(1.0, 0.85, 2.4);
    // ejection seat fairing behind the canopy

// ---------- Audio ----------
let actx = null, masterGain = null, comp = null, noiseBuf = null;
function initAudio() {
  if (!actx) {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    comp = actx.createDynamicsCompressor();
    comp.threshold.value = -18; comp.knee.value = 12; comp.ratio.value = 5;
    masterGain = actx.createGain(); masterGain.gain.value = 0.9;
    comp.connect(masterGain).connect(actx.destination);
    const len = actx.sampleRate * 2;
    noiseBuf = actx.createBuffer(1, len, actx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  if (actx.state === 'suspended') actx.resume();
}
function noiseSrc() { const s = actx.createBufferSource(); s.buffer = noiseBuf; s.loop = true; return s; }
function envGain(t, atk, hold, peak) {
  const g = actx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(peak, t + atk);
  g.gain.exponentialRampToValueAtTime(0.0001, t + atk + hold);
  return g;
}
function sfxBoom(pos, size) {
  if (!actx) return;
  const t = actx.currentTime, big = size > 1.2;
  const n = noiseSrc(), lp = actx.createBiquadFilter(), ng = envGain(t, 0.003, big ? 0.7 : 0.28, big ? 0.7 : 0.4);
  lp.type = 'lowpass';
  lp.frequency.setValueAtTime(3200, t);
  lp.frequency.exponentialRampToValueAtTime(big ? 140 : 380, t + (big ? 0.8 : 0.3));
  n.connect(lp).connect(ng).connect(comp); n.start(t); n.stop(t + (big ? 0.95 : 0.36));
  const o = actx.createOscillator(), og = envGain(t, 0.003, big ? 0.45 : 0.2, big ? 0.6 : 0.42);
  o.type = 'sine';
  o.frequency.setValueAtTime(big ? 96 : 140, t);
  o.frequency.exponentialRampToValueAtTime(big ? 30 : 62, t + (big ? 0.5 : 0.22));
  o.connect(og).connect(comp); o.start(t); o.stop(t + (big ? 0.6 : 0.26));
}
function sfxDamage() {
  if (!actx) return;
  const t = actx.currentTime;
  const o = actx.createOscillator(), g = envGain(t, 0.002, 0.24, 0.4);
  o.type = 'sine';
  o.frequency.setValueAtTime(160, t);
  o.frequency.exponentialRampToValueAtTime(50, t + 0.26);
  o.connect(g).connect(comp); o.start(t); o.stop(t + 0.3);
  const n = noiseSrc(), bp = actx.createBiquadFilter(), ng = envGain(t, 0.001, 0.16, 0.44);
  bp.type = 'bandpass'; bp.frequency.value = 1800; bp.Q.value = 0.6;
  n.connect(bp).connect(ng).connect(comp); n.start(t); n.stop(t + 0.22);
}
function sfxAlarm(times, from, to) {
  if (!actx) return;
  const t0 = actx.currentTime;
  for (let i = 0; i < times; i++) {
    const t = t0 + i * 0.24;
    const o = actx.createOscillator(), g = envGain(t, 0.01, 0.2, 0.2);
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(from, t);
    o.frequency.linearRampToValueAtTime(to, t + 0.2);
    o.connect(g).connect(comp); o.start(t); o.stop(t + 0.25);
  }
}
function sfxWarp() {
  if (!actx) return;
  const t = actx.currentTime;
  [240, 300, 360, 480, 600].forEach((f, i) => {
    const o = actx.createOscillator(), g = envGain(t + i * 0.05, 0.1, 1.0, 0.1);
    o.type = i % 2 ? 'triangle' : 'sine';
    o.frequency.setValueAtTime(f, t + i * 0.05);
    o.frequency.exponentialRampToValueAtTime(f * 3.4, t + i * 0.05 + 0.9);
    o.connect(g).connect(comp); o.start(t + i * 0.05); o.stop(t + i * 0.05 + 1.3);
  });
}

const TRACK_URLS = {
  1914: ['https://raw.githubusercontent.com/izzyrios-source/rfree/refs/heads/main/1914.mp3.mp3'],
  1944: ['https://raw.githubusercontent.com/izzyrios-source/rfree/refs/heads/main/1944.mp3.mp3'],

};
const trackAudio = {};
let trackPlaying = null, realMusicMuted = false, musicMuted = false;
function getTrack(year) {
  if (trackAudio[year] !== undefined) return trackAudio[year];
  const urls = TRACK_URLS[year];
  if (!urls || !urls.length) { trackAudio[year] = null; return null; }
  const a = new Audio();
  a.loop = true; a.preload = 'auto'; a.volume = 0.8;
  a.addEventListener('error', () => { trackAudio[year] = null; });
  a.src = urls[0];
  trackAudio[year] = a;
  return a;
}
function playTrackForEra(year) {
  if (realMusicMuted || !actx) return;
  const a = getTrack(year);
  if (!a) return;
  for (const k of Object.keys(trackAudio)) {
    const o = trackAudio[k];
    if (o && !o.paused) { try { o.pause(); o.currentTime = 0; } catch (e) {} }
  }
  const p = a.play();
  if (p && p.catch) p.catch(() => {});
  trackPlaying = year;
}
function stopRealMusic() {
  for (const k of Object.keys(trackAudio)) {
    const o = trackAudio[k];
    if (o && !o.paused) { try { o.pause(); } catch (e) {} }
  }
  trackPlaying = null;
}
function musicStop() { stopRealMusic(); }
function toggleMusic() {
  musicMuted = !musicMuted; realMusicMuted = musicMuted;
  if (musicMuted) stopRealMusic();

}

  const dir = new THREE.Vector3(-Math.sin(a), 0, -Math.cos(a));

  b.position.copy(fromPlayer ? player.position : player.position).setY(0.05).addScaledVector(dir, 0.04);

  const base = player.rotation.y;

  const streams = 1 + S.wingmen;

  for (let i = 0; i < streams; i++) {

  // side guns gained by levelling: a matched pair firing straight out
  for (let i = 0; i < S.sideGuns; i++) {
    bulletAt(base + Math.PI / 2, true);

  if (S.rearGun > 0) bulletAt(base + Math.PI, true);

function stickInput() {
  // ZOOM. Hold either trigger and push either thumbstick up or down.
  // Quest 2/3 put a stick's Y on axis 3 and its X on axis 2; older runtimes put
  // them on 1 and 0. Read the axis pair that is actually alive, and take the
  // trigger's own `pressed` flag as well as its value, since that is what varies
  // between runtimes.
  let zoomAxis = 0, zoomHeld = false;
  for (const c of controllers) {
    const gp = c.userData.gp;
    if (!gp) continue;
    if (gp.buttons) {
      for (let b = 0; b < gp.buttons.length; b++) {
        const btn = gp.buttons[b];
        if (!btn) continue;
        if (b === 0 && ((btn.pressed) || (btn.value || 0) > 0.5)) zoomHeld = true;
      }
    }
    if (!gp.axes || !gp.axes.length) continue;
    const a = gp.axes;
    const yPair = a.length >= 4 ? a[3] : a[1];
    const xPair = a.length >= 4 ? a[2] : a[0];
    const y = yPair || xPair;               // whichever axis the stick is on
    if (Math.abs(y) > 0.15) zoomAxis = y;
  }
  if (zoomHeld && zoomAxis) {
    board.userData.zoom = Math.max(0.6, Math.min(2.2,
      (board.userData.zoom || 1) + zoomAxis * 1.1 * clock.getDelta()));
  }
  // keyboard fallback: Z and X, and 0 resets
  if (keys.KeyZ) board.userData.zoom = Math.min(2.2, (board.userData.zoom || 1) + 0.9 * clock.getDelta());
  if (keys.KeyX) board.userData.zoom = Math.max(0.6, (board.userData.zoom || 1) - 0.9 * clock.getDelta());
  if (keys.Digit0) board.userData.zoom = 1;
  let x = 0, z = 0;
  if (keys.KeyA || keys.ArrowLeft) x -= 1;
  if (keys.KeyD || keys.ArrowRight) x += 1;
  if (keys.KeyW || keys.ArrowUp) z -= 1;
  if (keys.KeyS || keys.ArrowDown) z += 1;
  for (const c of controllers) {
    const gp = c.userData.gp;
    if (!gp || !gp.axes) continue;
    const ax = gp.axes;
    const sx = ax.length >= 4 ? ax[2] : (ax[0] || 0);
    const sy = ax.length >= 4 ? ax[3] : (ax[1] || 0);
    if (Math.abs(sx) > 0.15) x += sx;
    if (Math.abs(sy) > 0.15) z += sy;
  }
  return { x: Math.max(-1, Math.min(1, x)), z: Math.max(-1, Math.min(1, z)) };
}

  const bodySize = Math.max(15, bodyFit);
  const titleH = titleSize * 1.4, bodyH = bodySize * 1.66;
  const totalH = titleH + bodyH * (lines.length - 1);

  c.strokeStyle = '#4fd0ff'; c.lineWidth = 3; c.strokeRect(3, 3, HUD_W - 6, HUD_H - 6);

  // rows are laid out from the top with fixed slots, and every line is fitted to width
  const rows = [
    { t: 'SCORE ' + S.score,                       max: 40, colour: '#4fd0ff', h: 40 },
    { t: 'LV ' + S.level + '    KILLS ' + S.kills, max: 30, colour: '#4fd0ff', h: 32 },
    { t: 'ERA ' + era().year,                      max: 28, colour: '#7cffb0', h: 30 },
    { t: S.weaponName + (S.shield > 0 ? '  SHIELD x' + S.shield : ''), max: 22, colour: '#ffd24a', h: 24 },
  ];
  let y = PAD + 4;
  for (const r of rows) {
    const size = fitFont(r.t, r.max, INNER);
    c.fillStyle = r.colour;
    c.fillText(r.t, PAD, y + size * 0.8);
    y += r.h;
  }
  // xp bar
  c.strokeStyle = '#7cffb0'; c.lineWidth = 2; c.strokeRect(PAD, y, INNER, 18);
  c.fillStyle = '#7cffb0';
  c.fillRect(PAD + 2, y + 2, (INNER - 4) * Math.min(1, S.xp / S.xpNeed), 14);
  y += 18 + 10;
  // damage meter: ten segments, one lost per hit
  const pct = Math.max(0, Math.round(S.hp / S.maxHp * 100));
  const mcol = pct > 60 ? '#7cffb0' : pct > 30 ? '#ffd24a' : '#ff5a4a';
  c.fillStyle = '#4fd0ff'; c.font = 'bold 22px monospace';
  c.fillText('HULL', PAD, y + 18);
  const segW = (INNER - 110 - 54) / 10;       // leave room for the label and the percentage
  for (let i = 0; i < 10; i++) {
    c.fillStyle = i < S.hp ? mcol : '#203038';
    c.fillRect(PAD + 100 + i * segW, y, Math.max(4, segW - 4), 22);
  }
  c.fillStyle = mcol; c.font = 'bold 20px monospace';
  c.textAlign = 'right';
  c.fillText(pct + '%', HUD_W - PAD, y + 18);
  c.textAlign = 'left';

  // diagnostic line, shown while the two shoulder buttons are held
  if (DIAG.shown) {
    const d = 'plane ' + player.position.x.toFixed(3) + ',' + player.position.z.toFixed(3) +
              '  field ' + field.position.x.toFixed(3) + ',' + field.position.z.toFixed(3) +
              '  tray ' + board.position.x.toFixed(2) + ',' + board.position.z.toFixed(2);
    c.fillStyle = '#ffb0b0'; fitFont(d, 18, INNER);
    c.fillText(d, PAD, HUD_H - 34);
  }
  // the bottom line carries two readings, each fitted into its own half
  const left = perf.fps + ' FPS  ' + perf.msAvg.toFixed(1) + ' ms';
  const right = 'MUSIC ' + (musicMuted ? 'OFF' : 'ON') + '  M';
  const half = INNER / 2 - 8;
  c.fillStyle = '#6fb8c8'; fitFont(left, 20, half);
  c.fillText(left, PAD, HUD_H - 12);
  c.fillStyle = '#9fe3ff'; fitFont(right, 20, half);
  c.textAlign = 'right';
  c.fillText(right, HUD_W - PAD, HUD_H - 12);
  c.textAlign = 'left';
  hudTex.needsUpdate = true;
}

// ---------- BOARD HEIGHT: fit the board to where your head actually is ----------
let boardPlacedFrames = 0;
const headPos = new THREE.Vector3();
renderer.xr.addEventListener('sessionstart', () => { boardPlacedFrames = 0; });
renderer.xr.addEventListener('sessionend', () => { board.position.set(0, BOARD_Y, -0.95); });
// every frame after placement, the board's place in the world is its home MINUS the
// distance it has been carried, which is what puts the plane back in front of you
let lastCamX = 0, lastCamZ = 0;
function holdBoardUnderPlayer(clampDt) {
  // the clouds shift by how far the field was carried this frame
  if (renderer.xr.isPresenting) driftClouds(clampDt, cam.x - lastCamX, cam.z - lastCamZ);
  lastCamX = cam.x; lastCamZ = cam.z;
}
// Vampire-Survivors style: the plane flies freely inside a frame a good deal
// larger than the board, and the board only slides when the plane reaches the
// frame's edge. In the middle, the plane moves and the ground stays put.
// The field scrolls: the plane never hits a wall. The board is carried along beneath
// the plane, keeping it inside a window centred on the board. The window is a good deal
// smaller than the board, so you reach the border long before the board runs out.
// The boundary stands still in front of you and the field runs on beneath it. The plane
// is stopped at the boundary; the field is pushed past it, so the grass keeps streaming
// while the frame stays put.
const BOUND_X = 0.86, BOUND_Z = 0.50;      // the plane is kept inside the visible tray
const WINDOW_X = 0.0, WINDOW_Z = 0.0;      // VS-style: the field is centred on the plane
const cam = { x: 0, z: 0 };                // how far the board has been carried
const boardHome = new THREE.Vector3();     // where the board sits under your head
const DIAG = { px: 0, pz: 0, runs: 0, shown: false };
function applyZoom() {
  const z = board.userData.zoom || 1;
  board.scale.setScalar(z);
  // Carry the battlefield by the plane's travel, then show it through the window.
  field.position.x = -player.position.x;
  field.position.z = -player.position.z;
  cam.x = player.position.x; cam.z = player.position.z;
  // the window is held on the tray and shows the field wherever the field has got to,
  // so the ground slides through the frame while the frame itself never moves
}
// the bank angle reads the field's motion, so the plane leans into a push
function framePush() {
  // the plane is pinned to the middle, so the field's speed is what tells the plane
  // how hard it is being pushed
  return { x: 0, z: 0 };
}
function placeBoardForHead() {
  if (!renderer.xr.isPresenting) return;
  for (const c of controllers) {           // Y or B re-centres the board
    const gp = c.userData.gp;
    if (gp && gp.buttons && gp.buttons[4] && gp.buttons[4].pressed) boardPlacedFrames = 0;
  }
  if (boardPlacedFrames > 30) return;
  renderer.xr.getCamera().getWorldPosition(headPos);
  if (headPos.y < 0.3) return;             // headset pose not ready yet
  boardPlacedFrames++;
  // 55 cm below your eyes, 85 cm in front: a table you look down on, seated or standing
  board.position.set(headPos.x, Math.max(0.35, headPos.y - 0.55), headPos.z - 0.85);
  boardHome.copy(board.position);
}

// ---------- FRAME ----------
function gameFrame() {
  const frameStart = performance.now();
  const dt = Math.min(clock.getDelta(), 0.05);
  frame++;
  perf.frames++;
  const el = frameStart - perf.last;
  if (el >= 500) { perf.fps = Math.round(perf.frames * 1000 / el); perf.frames = 0; perf.last = frameStart; }
  perf.samples.push(dt * 1000); if (perf.samples.length > 40) perf.samples.shift();
  perf.msAvg = perf.samples.reduce((a, b) => a + b, 0) / perf.samples.length;

  if (bannerUntil && frameStart > bannerUntil) { banner.style.opacity = 0; bannerUntil = 0; }
  else if (bannerUntil) banner.style.opacity = 1;

  const now = performance.now();

  // diagnostic toggle: A+X on a keyboard, or grip on either controller
  DIAG.shown = !!(keys.KeyA && keys.KeyX);
  for (const c of controllers) {
    const gp = c.userData.gp;
    if (gp && gp.buttons) {
      for (let b = 0; b < gp.buttons.length; b++) {
        const btn = gp.buttons[b];
        if (btn && b === 1 && btn.pressed) DIAG.shown = true;
      }
    }
  }
  placeBoardForHead();
  applyZoom();
  holdBoardUnderPlayer(dt);
  // Y button (left controller, upper face button) quits to the title screen
  for (const c of controllers) {
    const gp = c.userData.gp;
    const y = !!(gp && c.userData.hand === 'left' && gp.buttons && gp.buttons[5] && gp.buttons[5].pressed);
    if (y && !c.userData.yWas && S.state !== 'title') quit();
    c.userData.yWas = y;
  }
  if (S.state === 'play') {
    S.time += dt;
    S.eraTimer += dt;

    // --- move the player, clamped to the board ---
    const inp = stickInput();
    const speed = 0.62 * (1 + (S.speedBonus || 0));
    player.position.x += inp.x * speed * dt;
    player.position.z += inp.z * speed * dt;
    DIAG.px = player.position.x; DIAG.pz = player.position.z; DIAG.runs++;
    // the plane faces the way it moves; when still, it keeps its last heading
    if (Math.abs(inp.x) + Math.abs(inp.z) > 0.05) {
      const want = Math.atan2(inp.x, inp.z) + Math.PI;
      let d = want - player.rotation.y;
      while (d > Math.PI) d -= Math.PI * 2;
      while (d < -Math.PI) d += Math.PI * 2;
      player.rotation.y += Math.max(-6 * dt, Math.min(6 * dt, d));
    }
    // bank into the turn: a roll follows the frame's push, plus the stick's turn
    const push = framePush();
    const bankFromPush = Math.max(-0.7, Math.min(0.7, push.x * 3.2));
    const turnRate = inp.x * 0.45;
    const wantRoll = -bankFromPush - turnRate;
    player.rotation.z += (wantRoll - player.rotation.z) * Math.min(1, 5 * dt);

    // --- auto-fire ---
    fireTimer -= dt;
    if (fireTimer <= 0) { fireTimer = 1 / S.fireRate; fire(); }
    // --- mines laid behind you ---
    S.mineTimer -= dt;
    if (S.mines > 0 && S.mineTimer <= 0) { S.mineTimer = 2.4; dropMine(); }
    // --- the era's ring of fire ---
    if (S.ringShots > 0) {
      S.ringTimer -= dt;
      if (S.ringTimer <= 0) { S.ringTimer = S.ringEvery; ringVolley(); }
    }
    // --- bonuses appear across the field ---
    if (pickups.length < CRATES_TARGET && Math.random() < dt * 0.06) spawnPickup();

    // --- swarms ramp with level and era ---
    const spawnRate = 3 + S.level * 1.1 + S.eraIndex * 1.5;
    if (Math.random() < dt * spawnRate) spawnEnemy();

    // --- era advances on a timer, as a chapter ---
    if (S.eraTimer >= S.ERASECONDS) {
      S.eraTimer = 0;
      S.eraIndex = (S.eraIndex + 1) % ERAS.length;
      applyEraGuns();
      playTrackForEra(era().year);
      showBanner('ERA ' + era().year, 2.2);
      sfxWarp();
    }
  }

  // --- bullets ---
  // the painted ground slides only as far as the board has been pushed, so the
  // hills and roads visibly run beneath you when you reach the frame edge
  // the ground is painted once, so its texture offset is what shows the motion
  grassTex.offset.x = cam.z / (ARENA_X * 2);
  grassTex.offset.y = -cam.x / (ARENA_X * 2);
  if (S.state !== 'play') { renderer.render(scene, camera); return; }
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.life -= dt;
    if (b.homing && enemies.length) {          // homing shots curve toward the nearest plane
      let best = null, bd = 0.55;
      for (const e of enemies) {
        const dd = b.mesh.position.distanceTo(e.mesh.position);
        if (dd < bd) { bd = dd; best = e; }
      }
      if (best) {
        tmpV.copy(best.mesh.position).sub(b.mesh.position); tmpV.y = 0;
        if (tmpV.lengthSq() > 0) b.dir.lerp(tmpV.normalize(), Math.min(1, 2.4 * dt)).normalize();
      }
    }
    b.mesh.position.addScaledVector(b.dir, S.bulletSpeed * dt);
    const out = Math.abs(b.mesh.position.x) > ARENA_X + 0.1 || Math.abs(b.mesh.position.z) > ARENA + 0.1;
    if (b.life <= 0 || out) { field.remove(b.mesh); bullets.splice(i, 1); continue; }
    // hit test: planes and crates both stop a bullet
    let spent = false;
    for (let q = pickups.length - 1; q >= 0; q--) {
      const p = pickups[q];
      if (b.mesh.position.distanceTo(p.mesh.position) < 0.048) {
        p.hp -= S.damage;
        if (p.hp <= 0) breakCrate(p); else burst(b.mesh.position.clone(), 0.02);
        field.remove(b.mesh); bullets.splice(i, 1);
        spent = true;
        break;
      }
    }
    if (spent) continue;
    for (let k = enemies.length - 1; k >= 0; k--) {
      const e = enemies[k];
      if (b.mesh.position.distanceTo(e.mesh.position) < 0.045) {
        e.hp -= S.damage; e.hitFlash = 0.12;
        if (e.hp <= 0) {
          burst(e.mesh.position.clone(), e.kind && e.kind.name === 'BOMBER' ? 0.09 : 0.05);
          for (let g = 0; g < (e.gem || 1); g++) dropGem(e.mesh.position.clone());
          field.remove(e.mesh); enemies.splice(k, 1);
          S.kills++; S.score += (e.bounty || 10);
        } else {
          b.hits++;
          if (b.hits > S.pierce) { field.remove(b.mesh); bullets.splice(i, 1); }
        }
        break;
      }
    }
  }

  // --- enemies: walk straight at the player ---
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    tmpV.copy(player.position).sub(e.mesh.position); tmpV.y = 0;
    const d = tmpV.length();
    if (d > 0.0001) tmpV.divideScalar(d);
    e.mesh.position.addScaledVector(tmpV, e.speed * dt);
    e.mesh.rotation.y = Math.atan2(tmpV.x, tmpV.z);
    if (e.hitFlash > 0) {
      e.hitFlash -= dt;
      e.mesh.scale.setScalar(1 + e.hitFlash * 2.5);
    } else e.mesh.scale.setScalar(1);
    // a chipped bar over anything with real armour, so you can see what you have done
    if (e.maxHp > 2) {
      if (!e.bar) {
        e.bar = new THREE.Sprite(new THREE.SpriteMaterial({ color: 0xff5a4a, transparent: true,
          depthWrite: false, toneMapped: false }));
        e.bar.scale.set(0.03, 0.005, 1);
        e.mesh.add(e.bar);
      }
      const frac = e.hp / e.maxHp;
      e.bar.visible = frac < 0.999;
      e.bar.scale.x = Math.max(0.002, 0.03 * frac);
      e.bar.position.set(0, kind_bar_y(e), 0);
    }
    // reach the player
    if (d < 0.055) {
      if (!player.userData.grace || now > player.userData.grace) damagePlayer();
      field.remove(e.mesh); enemies.splice(i, 1);
      continue;
    }
  }

  // --- mines: rest, then burst when a plane comes near ---
  for (let i = mines.length - 1; i >= 0; i--) {
    const m = mines[i];
    if (now - m.born > m.life) { field.remove(m.mesh); mines.splice(i, 1); continue; }
    m.mesh.material.opacity = 0.55 + Math.sin(now / 140) * 0.35;
    for (let k = enemies.length - 1; k >= 0; k--) {
      const e = enemies[k];
      if (e.mesh.position.distanceTo(m.mesh.position) < 0.075) {
        burst(m.mesh.position.clone(), 0.05);
        field.remove(m.mesh); mines.splice(i, 1);
        field.remove(e.mesh);
        if (e.hp - S.damage <= 0) {
          for (let g = 0; g < (e.gem || 1); g++) dropGem(e.mesh.position.clone());
          S.kills++; S.score += (e.bounty || 10);
        }
        enemies.splice(k, 1);
        break;
      }
    }
  }

  // --- crates: static, and they stay put until they are shot open ---
  for (let i = crateRefills.length - 1; i >= 0; i--) {
    const r = crateRefills[i];
    if (now >= r.due) {                     // its minute is up: a new crate takes the spot
      spawnCrateAt(r.x, r.z);
      crateRefills.splice(i, 1);
    }
  }

  // --- gems: drift to the player and level you up ---
  for (let i = gems.length - 1; i >= 0; i--) {
    const g = gems[i];
    tmpV.copy(player.position).sub(g.mesh.position); tmpV.y = 0;
    const d = tmpV.length();
    if (d < S.magnet) {
      if (d > 0.0001) tmpV.divideScalar(d);
      g.mesh.position.addScaledVector(tmpV, 0.9 * dt);
    }
    if (d < 0.04) {
      field.remove(g.mesh); gems.splice(i, 1);
      S.xp++;
      if (S.xp >= S.xpNeed) {
        S.xp = 0; S.xpNeed = Math.floor(S.xpNeed * 1.7) + 8;
        S.level++;
        // every level, the era moves on: new enemy planes and often a new gun
        S.eraIndex = (S.eraIndex + 1) % ERAS.length;
        applyEraGuns();
        playTrackForEra(era().year);
        offerUpgrades();
      }
    }
  }

  // --- sparks ---
  for (let i = sparks.length - 1; i >= 0; i--) {
    const s = sparks[i];
    const age = (now - s.born) / 1000;
    if (age > s.life / 1000) { field.remove(s.mesh); sparks.splice(i, 1); continue; }
    s.mesh.position.addScaledVector(s.vel, dt);
    s.mesh.material.opacity = 1 - age / (s.life / 1000);
    s.mesh.scale.setScalar(s.size * (0.6 + age * 2.5));
  }

  // --- player glow pulse and grace blink ---
  playerGlow.material.opacity = 0.75 + Math.sin(now / 300) * 0.15;
  playerMesh.visible = !player.userData.grace || Math.floor(now / 120) % 2 === 0;

  if (frame % 3 === 0) drawHUD();
  renderer.render(scene, camera);
}

renderer.setAnimationLoop(() => {
  try { gameFrame(); } catch (err) {
    if (err.message !== lastError) {
      lastError = err.message;
      renderText('stopped', err.message);
    }
  }
});

// ---------- BOOT ----------
quit();


</script>
</body>
